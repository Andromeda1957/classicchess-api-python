        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                ply:
                  minimum: 0
                  type: integer
              required:
              - ply
              type: object
      responses:
        '200':
          description: The game after the bot's move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymGameState'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the gym:play scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such game, or not the account's own game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale ply, not the bot's turn, or the game is over.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
