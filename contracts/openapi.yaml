    post:
      summary: Import curated games into an account collection
      description: Legacy public_player_games imports a player archive. curated_games combines filters, excludes Master DB and user imports, and appends at most 1000 games per call. Repeat identical selection with next_after_game_id until has_more is false. matched counts the full selection; added, already_present and processed count this batch. Retrying a batch preserves existing notes and progress. dry_run makes no changes.
      operationId: importCollectionGames
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - properties:
                  source:
                    const: public_player_games
                  name:
                    description: Collection name to create or reuse when collection_id is omitted.
                    maxLength: 120
                    type: string
                  collection_id:
                    description: Existing account collection ID.
                    type: integer
                  archive_player:
                    maxLength: 80
                    type: string
                  since:
                    maximum: 9999
                    minimum: 1400
                    type: integer
                  until:
                    maximum: 9999
                    minimum: 1400
                    type: integer
                required:
                - source
                - archive_player
                type: object
              - additionalProperties: false
                properties:
                  source:
                    const: curated_games
                  collection_id:
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  filters:
                    description: OR groups; criteria inside each nonempty group are AND. Multiple players/events within a list are OR.
                    items:
                      additionalProperties: false
                      properties:
                        players:
                          description: Curated player slugs; either participant, including event games.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        events:
                          description: Curated event slugs.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        since:
                          maximum: 9999
                          minimum: 1400
                          type: integer
                        until:
                          maximum: 9999
                          minimum: 1400
                          type: integer
                        notable:
                          description: Curated notable games across every player, or their complement.
                          type: boolean
                        q:
                          maxLength: 2000
                          minLength: 1
                          type: string
                        theme:
                          maxLength: 160
                          minLength: 1
                          type: string
                        eco:
                          maxLength: 160
                          minLength: 1
                          type: string
                        result:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_q:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_author:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_book:
                          maxLength: 160
                          minLength: 1
                          type: string
                      type: object
                    maxItems: 10
                    minItems: 1
                    type: array
                  exclude:
                    description: Subtract games matching any exclusion group.
                    items:
                      additionalProperties: false
                      properties:
                        players:
                          description: Curated player slugs; either participant, including event games.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        events:
                          description: Curated event slugs.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        since:
                          maximum: 9999
                          minimum: 1400
                          type: integer
                        until:
                          maximum: 9999
                          minimum: 1400
                          type: integer
                        notable:
                          description: Curated notable games across every player, or their complement.
                          type: boolean
                        q:
                          maxLength: 2000
                          minLength: 1
                          type: string
                        theme:
                          maxLength: 160
                          minLength: 1
                          type: string
                        eco:
                          maxLength: 160
                          minLength: 1
                          type: string
                        result:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_q:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_author:
                          maxLength: 160
                          minLength: 1
                          type: string
                        annotation_book:
                          maxLength: 160
                          minLength: 1
                          type: string
                      type: object
                    maxItems: 10
                    type: array
                  batch_size:
                    default: 1000
                    maximum: 1000
                    minimum: 1
                    type: integer
                  after_game_id:
                    default: 0
