      - name: opponent
        in: query
        schema:
          maxLength: 80
          type: string
      responses:
        '200':
          description: Player summary or head-to-head record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStats'
        '400':
          description: player is missing, or the mode, opponent or query is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
