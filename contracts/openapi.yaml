  /api/v1/account/mobile/settings/:
    get:
      summary: Native mobile account settings
      operationId: getMobileSettings
      security:
      - MobileSessionToken: *id003
      responses:
        '200':
          description: Board, engine, sound, speech, cast and debug settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSettings'
        '401':
          description: Missing, invalid, expired or revoked mobile session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Update native mobile board, engine, sound, speech or cast settings
      operationId: updateMobileSettings
      security:
      - MobileSessionToken: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Send only the settings to change. Sound and speech apply to the Android app only.
              properties:
                board_theme:
                  description: A key from GET board.themes.
                  type: string
                piece_set:
                  description: A key from GET board.piece_sets.
                  type: string
                engine_depth:
                  description: An unsupported depth resets to the default.
                  type: integer
                engine_lines:
                  description: 1 to 5; any other value resets to the default.
                  type: integer
                engine_eval_bar:
                  type: boolean
                engine_enabled:
                  type: boolean
                sound_set:
                  description: A key from GET sound.sets; choosing one turns speech off.
                  type: string
                sound_volume:
                  description: 0 to 100; values outside the range are clamped.
                  type: integer
                speech_enabled:
                  description: Requires speech.available.
                  type: boolean
                speech_level:
                  description: 1 to 10, clamped to that range and rounded to the nearest 0.5. Requires speech.available.
                  type: number
                speech_voice:
                  description: Requires speech.available.
                  type: string
                cast_coach_email:
                  description: An empty string removes it.
                  maxLength: 254
                  type: string
                cast_cc_emails:
                  type:
                  - array
                  - string
                  items:
                    type: string
                  description: A list of addresses, or one string separated by commas, semicolons or spaces.
                cast_bcc_emails:
                  type:
                  - array
                  - string
                  items:
                    type: string
                  description: A list of addresses, or one string separated by commas, semicolons or spaces.
              type: object
      responses:
        '200':
          description: Updated account settings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileSettings'
        '400':
          description: Invalid preference or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired or revoked mobile session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/account/me/:
    get:
      summary: Authenticated account summary
      description: 'Read-only. Also reports whether the account has a password, its two-step sign-in state, linked Google and Lichess accounts, entitlements, and the credential that made the request: its kind and name, and for a token its scopes and expiry. Token secrets, hashes and prefixes are never returned. Email, password, two-step sign-in and security keys change on the website, or in the app after a device confirmation.'
      operationId: getAccount
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      responses:
        '200':
          description: Current account, its security and linked-account state, and the calling credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the account:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - account:read
  /api/v1/account/preferences/:
    get:
      summary: The website's board, engine, viewer, sound and speech preferences
      description: The values the website Settings page and board pickers use, with the choices they offer. Sound and speech are the website's own; the Android app keeps separate ones that this API never reads or changes.
      operationId: getPreferences
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      responses:
        '200':
          description: Current website preferences and their choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPreferences'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the preferences:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - preferences:read
    patch:
      summary: Change some website preferences
      description: Only the fields sent change. Every value is checked as the website checks it, and narration is checked against the account on every write. When any value is refused, nothing changes. Safe to retry.
      operationId: updatePreferences
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              description: Send only the preferences to change. When any value is refused, nothing changes.
              properties:
                disable_animations:
                  type: boolean
                reading_font:
                  description: A key from catalogs.reading_fonts.
                  type: string
                board_theme:
                  description: A key from catalogs.board_themes.
                  type: string
                piece_set:
                  description: A key from catalogs.piece_sets.
                  type: string
                board_input_mode:
                  description: A key from catalogs.board_input_modes.
                  type: string
                keyboard_move_entry:
                  type: boolean
                move_tree_theme:
                  description: A key from catalogs.move_tree_themes.
                  type: string
                annotation_color_normal:
                  pattern: ^#[0-9A-Fa-f]{6}$
                  type: string
                annotation_color_ctrl:
                  pattern: ^#[0-9A-Fa-f]{6}$
                  type: string
                annotation_color_alt:
                  pattern: ^#[0-9A-Fa-f]{6}$
                  type: string
                annotation_color_ctrl_alt:
                  pattern: ^#[0-9A-Fa-f]{6}$
                  type: string
                autoplay_seconds:
                  maximum: 180
                  minimum: 1
                  type: integer
                engine_depth:
                  description: A value from catalogs.engine_depths.
                  type: integer
                engine_lines:
                  maximum: 5
                  minimum: 1
                  type: integer
                engine_eval_bar:
                  type: boolean
                engine_enabled:
                  type: boolean
                sound_set:
                  description: A key from catalogs.sound_sets. Choosing one turns website narration off.
                  type: string
                sound_volume:
                  maximum: 100
                  minimum: 0
                  type: integer
                speech_enabled:
                  description: Turning narration on needs speech_available and selects the silent sound set.
                  type: boolean
                speech_level:
                  description: Needs speech_available. Rounded to the nearest 0.5.
                  maximum: 10
                  minimum: 1
                  type: number
                speech_voice:
                  description: Needs speech_available.
                  maxLength: 200
                  type: string
                viewer_layouts:
                  $ref: '#/components/schemas/ViewerLayoutState'
                  description: The complete layout state; it replaces the saved one.
                viewer_keybindings:
                  additionalProperties:
                    items:
                      type: string
                    type: array
                  description: 'Replaces every override: a command left out returns to its default key.'
                  type: object
              type: object
      responses:
        '200':
          description: The updated website preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPreferences'
        '400':
          description: 'invalid_preference: an unknown field, a null, or a value the website would refuse, including narration this account cannot use; invalid_request: the body is not a JSON object. Nothing changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the preferences:write scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - preferences:write
