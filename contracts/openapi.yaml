      x-required-scopes:
      - notifications:write
components:
  schemas:
    ChessTodayDay:
      additionalProperties: false
      properties:
        date:
          description: Current site date; only present on the today endpoint.
          format: date
          type: string
        month:
          maximum: 12
          minimum: 1
          type: integer
        day:
          maximum: 31
          minimum: 1
          type: integer
        timezone:
          description: IANA timezone used for daily notification selection.
          type: string
        url:
          description: Relative API URL for this month and day.
          type: string
        featured_entry_id:
          type:
          - string
          - 'null'
        entries:
          items:
            $ref: '#/components/schemas/ChessTodayEntry'
          maxItems: 20
          type: array
      required:
      - month
      - day
      - timezone
      - url
      - featured_entry_id
      - entries
      type: object
    ChessTodayEntry:
      additionalProperties: false
      properties:
        id:
          type: string
        category:
          enum:
          - birth
          - death
          - game
          - event
          - rating_title
          - culture
          - technology
          - publication
          - rules
          type: string
        year:
          maximum: 9999
          minimum: 1
          type: integer
        text:
          description: The concise text used in daily notifications.
          maxLength: 500
          type: string
        details:
          items:
            maxLength: 500
            type: string
          maxItems: 10
          type: array
        sources:
          items:
            additionalProperties: false
            properties:
              id:
                type: string
              url:
                format: uri
                type: string
              title:
                type: string
              publisher:
                type: string
            required:
            - id
            - url
            - title
            - publisher
            type: object
          maxItems: 10
          type: array
        related:
          items:
            additionalProperties: false
            properties:
              kind:
                enum:
                - game
                - event
                - player
                - gallery
                - book
                - daily
                type: string
              identifier:
                type: string
              label:
                type: string
              url:
                type:
                - string
                - 'null'
                description: Relative public URL; null when the related public item is unavailable.
            required:
            - kind
            - identifier
            - label
            - url
            type: object
          maxItems: 10
          type: array
        target_url:
          description: Notification destination; a public archive item or this date's JSON as fallback.
          type: string
        photograph:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: A photograph with a verified event association, when available.
          properties:
            image_url:
              type: string
            gallery_url:
              type: string
            alt_text:
              type: string
            credit:
              type: string
            artist:
              type: string
            source_name:
              type: string
            source_url:
              format: uri
              type: string
            license:
              type: string
            license_url:
              type: string
            width:
              type: integer
            height:
              type: integer
          required:
          - image_url
          - gallery_url
          - alt_text
          - credit
          - artist
          - source_name
          - source_url
          - license
          - license_url
          - width
          - height
        player:
          additionalProperties: false
          description: 'The archive player to picture beside the entry: its game''s archive player, else its first related player with a public page; absent when none has a portrait.'
          properties:
            name:
              type: string
            slug:
              type: string
            portrait:
              properties:
                image:
                  type: string
                thumbnail:
                  type: string
              type: object
            urls:
              allOf:
              - $ref: '#/components/schemas/ResourceLinks'
              - required:
                - api_detail
                - html_about
          required:
          - name
          - slug
          - portrait
          - urls
          type: object
      required:
      - id
      - category
      - year
      - text
      - details
      - sources
      - related
      - target_url
      - photograph
      type: object
    MasterGame:
      description: MasterDB search metadata. Tokens identify MasterDB games, not curated archive slugs.
      properties:
        token:
          maxLength: 80
          pattern: ^g[0-9a-z]+-[0-9a-f]{12}$
          type: string
        white:
          type: string
        black:
          type: string
        display_white:
          type: string
        display_black:
          type: string
        result:
          type: string
        event:
          type: string
        site:
          type: string
        date:
          type: string
        played_on:
          type:
          - string
          - 'null'
        year:
          type:
          - integer
          - 'null'
        round:
          type: string
        white_elo:
          type:
          - integer
          - 'null'
        black_elo:
          type:
          - integer
          - 'null'
        eco:
          type: string
        opening:
          type: string
        ply_count:
          type:
          - integer
          - 'null'
        move_count:
          type:
          - integer
          - 'null'
        source_count:
          type: integer
        urls:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - token
      - white
      - black
      - display_white
      - display_black
      - result
      - event
      - site
      - date
      - played_on
      - year
      - round
      - white_elo
      - black_elo
      - eco
      - opening
      - ply_count
      - move_count
      - source_count
      - urls
      type: object
    MasterGameDetail:
      allOf:
      - $ref: '#/components/schemas/MasterGame'
      - properties:
          pgn:
            type: string
          mainline:
            $ref: '#/components/schemas/Mainline'
          head_to_head:
            anyOf:
            - $ref: '#/components/schemas/HeadToHeadRecord'
            - type: 'null'
            description: Every MasterDB game between White and Black, from White's side; null when the names do not resolve to two players with a game together, or the record is unavailable. Absent from older servers.
          archive_players:
            $ref: '#/components/schemas/MasterGameArchivePlayers'
            description: Absent from older servers.
        required:
        - pgn
        - mainline
        type: object
    MasterGamePage:
      properties:
        query:
          type: string
        filters_applied:
          description: True when player, side and result constraints are applied before pagination.
          type: boolean
        count:
          description: Lower bound unless count_is_exact is true.
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          description: Known pages so far; follow next rather than assuming an exact total.
          type: integer
        count_is_exact:
          type: boolean
        result_limit:
          type: integer
        hit_result_limit:
          description: Search stopped at the server result limit; refine the query.
          type: boolean
        next:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
        hint:
          type: string
        results:
          items:
            $ref: '#/components/schemas/MasterGame'
          type: array
        player_choices:
          description: Selectable identities when a player name is ambiguous.
          items:
            properties:
              name:
                type: string
              search_name:
                type: string
            required:
            - name
            - search_name
            type: object
          type: array
        player_suggestions:
          description: Full player names for spelling help when the query resolves to a player or matchup; matchups include both players, search_name preserves any year constraint, and game results remain available.
          items:
            properties:
              name:
                type: string
              search_name:
                type: string
            required:
            - name
            - search_name
            type: object
          type: array
        interpretation:
          anyOf:
          - $ref: '#/components/schemas/MasterSearchInterpretation'
          - type: 'null'
          description: null when q names several possible players (see player_choices). Absent from older servers.
        head_to_head:
          anyOf:
          - $ref: '#/components/schemas/HeadToHeadRecord'
          - type: 'null'
          description: The pair's record over every game in q's years, as the website's score card shows it; player, side and result filters do not apply. null unless interpretation.kind is head_to_head and the record is available. Absent from older servers.
      required:
      - query
      - count
      - page
      - page_size
      - page_count
      - count_is_exact
      - result_limit
      - hit_result_limit
      - next
      - previous
      - message
      - hint
      - results
      type: object
    MasterGameExport:
      allOf:
      - $ref: '#/components/schemas/MasterGame'
      - properties:
          pgn:
            description: Omitted when pgnInJson is false.
            type: string
        type: object
      description: One newline-delimited JSON export record.
    HeadToHeadRecord:
      description: Two players' games against each other, the score card the website shows beside them.
      properties:
        player:
          description: The resolved player whose wins and losses result counts.
          type: string
        opponent:
          description: The resolved opponent.
          type: string
        since:
          type:
          - integer
          - 'null'
          description: First year counted; null when every year counts.
        until:
          type:
          - integer
          - 'null'
          description: Last year counted; null when every year counts.
        result:
          $ref: '#/components/schemas/StatsRecord'
          description: total, wins, losses and draws from player's side.
        urls:
          allOf:
          - $ref: '#/components/schemas/ResourceLinks'
          - required:
            - api_games
            - html_games
            - html_stats
          description: api_games and html_games list the counted games; html_stats is the website's all-years statistics for the pair.
      required:
      - player
      - opponent
      - since
      - until
      - result
      - urls
      type: object
    MasterSearchInterpretation:
      description: How the server read q, the line the website shows above the results.
      properties:
        kind:
          description: 'player: one player''s games; head_to_head: two players'' games against each other; text: a match on players, events, sites and ECO codes.'
          enum:
          - player
          - head_to_head
          - text
          type: string
        player:
          type:
          - string
          - 'null'
          description: The resolved player; null for text.
        opponent:
          type:
          - string
          - 'null'
          description: The resolved opponent; head_to_head only.
        text:
          type:
          - string
          - 'null'
          description: The matched words; text only.
        since:
          type:
          - integer
          - 'null'
          description: First year of q's year constraint; null without one.
        until:
          type:
          - integer
          - 'null'
          description: Last year of q's year constraint; null without one.
      required:
      - kind
      - player
      - opponent
      - text
      - since
      - until
      type: object
    MasterGameArchivePlayer:
      allOf:
      - $ref: '#/components/schemas/PlayerIdentity'
      - properties:
          urls:
            allOf:
            - $ref: '#/components/schemas/ResourceLinks'
            - required:
              - api_detail
              - api_bio
              - html_about
        required:
        - urls
        type: object
      description: A curated archive player whose exact name is on one side of the game.
    MasterGameArchivePlayers:
      description: Each side's curated archive player, as the website links its name to a biography.
      properties:
        white:
          anyOf:
          - $ref: '#/components/schemas/MasterGameArchivePlayer'
          - type: 'null'
          description: null unless White's name matches exactly one archive player.
        black:
          anyOf:
          - $ref: '#/components/schemas/MasterGameArchivePlayer'
          - type: 'null'
          description: null unless Black's name matches exactly one archive player.
      required:
      - white
      - black
      type: object
    Mainline:
      description: Board-ready mainline moves parsed from a game's PGN.
      properties:
        initial_fen:
          type: string
        final_fen:
          type: string
        moves:
          items:
            properties:
              ply:
                minimum: 1
                type: integer
              san:
                type: string
              uci:
                type: string
              fen:
                description: Position after this move.
                type: string
            required:
            - ply
            - san
            - uci
            - fen
            type: object
          type: array
        truncated:
          description: True when the mainline stopped at the server ply limit.
          type: boolean
        parse_error:
          description: True when the PGN could not be read, or a move was illegal; moves then end before it.
          type: boolean
      required:
      - initial_fen
      - final_fen
      - moves
      - truncated
      - parse_error
      type: object
    ApiError:
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
    PlayerResolutions:
      properties:
        query:
          type: string
        limit:
          maximum: 50
          minimum: 1
          type: integer
        masterdb_available:
          description: False when the Master database is not connected; masterdb is then empty.
          type: boolean
        masterdb:
          properties:
            count:
              minimum: 0
              type: integer
            results:
              items:
                description: A MasterDB player identity, which may merge several source spellings.
                properties:
                  name:
                    type: string
                  search_name:
                    type: string
                  aliases:
                    description: Source spellings merged into this identity.
                    items:
                      type: string
                    type: array
                  game_count:
                    minimum: 0
                    type: integer
                  max_elo:
                    type:
                    - integer
                    - 'null'
                required:
                - name
                - search_name
                - aliases
                - game_count
                - max_elo
                type: object
              type: array
          required:
          - count
          - results
          type: object
        public_archives:
          properties:
            count:
              minimum: 0
              type: integer
            results:
              items:
                properties:
                  name:
                    type: string
                  slug:
                    type: string
                  game_count:
                    minimum: 0
                    type: integer
                  criteria:
                    type: string
                  urls:
                    $ref: '#/components/schemas/ResourceLinks'
                required:
                - name
                - slug
                - game_count
                - criteria
                - urls
                type: object
              type: array
          required:
          - count
          - results
          type: object
      required:
      - query
      - limit
      - masterdb_available
      - masterdb
      - public_archives
      type: object
    StatsRecord:
      description: Game counts from the player's side; as_white and as_black only in summary mode.
      properties:
        total:
          minimum: 0
          type: integer
        wins:
          minimum: 0
          type: integer
        losses:
          minimum: 0
