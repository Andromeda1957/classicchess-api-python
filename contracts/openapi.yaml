          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          description: Bots, time controls and the newest games.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymHome'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the gym:read scope.
          content:
