  /api/v1/opening-explorer/:
    get:
      summary: Explore an opening position
      operationId: exploreOpening
      parameters:
      - name: fen
        in: query
        schema:
          type: string
      - name: play
        in: query
        description: Comma-separated UCI moves to play from fen, max 100 moves.
        schema:
          maxLength: 512
          type: string
      - name: moves
        in: query
        schema:
          default: 12
          maximum: 50
          type: integer
      - name: topGames
        in: query
        schema:
          default: 15
          maximum: 15
          type: integer
      - name: top_games
        in: query
        description: Alias of topGames.
        schema:
          deprecated: true
          maximum: 15
          type: integer
      - name: since
        in: query
        description: Include only games from this year or later when the source supports year indexes.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        description: Include only games from this year or earlier when the source supports year indexes.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: source_type
        in: query
        schema:
          enum:
          - study_player
          - masterdb
          type: string
      - name: sourceType
        in: query
        description: Alias of source_type.
        schema:
          deprecated: true
          enum:
          - study_player
          - masterdb
          type: string
      - name: source_key
        in: query
        description: Public source key returned by the sources endpoint; the master database key is masterdb.
        schema:
          type: string
      - name: sourceKey
        in: query
        description: Alias of source_key.
        schema:
          deprecated: true
          type: string
      - name: current_game_token
        in: query
        description: A MasterDB game token. When it reaches this position, the master database source also counts that game, even when the index does not include it.
        schema:
          type: string
      - name: currentGameToken
        in: query
        description: Alias of current_game_token.
        schema:
          deprecated: true
          type: string
      - name: current_game_slug
        in: query
        description: A public archive game slug; the same as current_game_token.
        schema:
          type: string
      - name: currentGameSlug
        in: query
        description: Alias of current_game_slug.
        schema:
          deprecated: true
          type: string
      responses:
        '200':
          description: Position totals, moves, and top reference games; ok is false, with error, for an invalid fen or play sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningExplorer'
        '400':
          description: moves, topGames, since or until is not an integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningExplorerRejection'
  /api/v1/opening-explorer/player/:
    get:
      summary: Find a player's games at a position without rendering website fragments
      description: Returns structured game rows, canonical API detail links, counts and pagination. A cold index returns 202 with pending and retry_after_ms.
      operationId: explorePlayerOpenings
      parameters:
      - name: player
        in: query
        schema:
          maxLength: 80
          type: string
      - name: fen
        in: query
        schema:
          maxLength: 100
          type: string
      - name: color
        in: query
        description: An unknown value means both.
        schema:
          default: both
          enum:
          - both
          - white
          - black
          type: string
      - name: result
        in: query
        description: The player's result; an unknown value means all.
        schema:
          default: all
          enum:
          - all
          - win
          - loss
          - draw
          type: string
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
      responses:
        '200':
          description: Player resolution or paginated position matches. No HTML or pager fragments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerOpeningExplorer'
        '202':
          description: Position index is building; retry the newest requested position after retry_after_ms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerOpeningExplorerPending'
        '400':
          description: player is too long, or page is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '422':
          description: The player has too many games for an on-demand index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '429':
          description: The index-build allowance is spent; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '503':
          description: The Master database is not connected or failed, the index could not be built, or build admission is unavailable (then honor Retry-After).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
  /api/v1/tablebase/:
    get:
      summary: Probe exact endgame tablebase results for a position
      description: Positions with at most 5 pieces use the site's local Syzygy tables when installed; 6 and 7 pieces, and smaller positions when local tables are unavailable, use the Lichess tablebase. 8-piece positions are labelled partial when Lichess answers. Positions with 9 or more pieces return covered false with a message. Each client may make 60 requests per minute.
      operationId: probeTablebase
      tags:
      - Analysis
      parameters:
      - name: fen
        in: query
        required: true
        schema:
          maxLength: 200
          type: string
      responses:
        '200':
          description: Tablebase coverage, result and per-move outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablebaseProbe'
        '400':
          description: fen is missing or is not a legal position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client exceeded the tablebase request budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/opening-explorer/sources/:
    get:
      summary: List opening explorer sources
      operationId: listOpeningExplorerSources
      responses:
        '200':
          description: Available opening explorer builds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningExplorerSources'
  /api/v1/opening-explorer/lichess/:
    get:
      summary: Explore a position in the Lichess opening database through this server
      description: Relays the Lichess opening explorer through this server's credentialed adapter, so clients never need a Lichess token. Without player the response covers the aggregate Lichess database; with a Lichess username it covers that player's games from the chosen color. Each client may make 60 requests per minute, and the server shares a global budget with every client.
      operationId: lichessOpeningExplorer
      tags:
      - Analysis
      parameters:
      - name: fen
        in: query
        description: Position to explore; omitted means the starting position.
        schema:
          maxLength: 100
          type: string
      - name: player
        in: query
        description: Lichess username. Blank means the aggregate Lichess database.
        schema:
          pattern: ^[A-Za-z0-9_-]{2,30}$
          type: string
      - name: color
        in: query
        description: The player's color; used only with player. both combines the player's games from each side.
        schema:
          default: both
          enum:
          - both
          - white
          - black
          type: string
      - name: result
        in: query
        description: The player's result; any value other than all requires player.
        schema:
          default: all
          enum:
          - all
          - win
          - loss
          - draw
          type: string
      responses:
        '200':
          description: Position count, next moves, sample Lichess games, the named opening, partial and sample_label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LichessOpeningExplorer'
        '400':
          description: The FEN, username, color or result is invalid, or a result filter was sent without player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '429':
          description: The client or the shared Lichess budget is exhausted; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '503':
          description: The server has no Lichess credential configured, Lichess is unavailable, or admission is unavailable (then honor Retry-After).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
