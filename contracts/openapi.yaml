        description: Exact 2 or 3, equivalent to CCNB-Format; absent both defaults to 2. Repeated values or header disagreement are rejected.
        schema:
          type: string
      - name: format
        in: query
        description: JSON metadata by default; txt returns only the complete list of names or titles.
        schema:
          default: json
          enum:
          - json
          - txt
          type: string
      responses:
        '200':
          description: Complete unpaginated catalog, or book titles only with format=txt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotatedBooks'
            text/plain:
              schema:
                type: string
                description: One book title per line.
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
