      - name: result
        in: query
        description: Result from the named player's side. Side/result require player.
        schema:
          default: any
          enum:
          - any
          - win
          - draw
          - loss
          type: string
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: format
        in: query
        description: pgn or ndjson (jsonl is an alias). Without it, an Accept header naming application/x-ndjson or application/jsonl selects ndjson.
        schema:
          enum:
          - pgn
          - ndjson
          - jsonl
          type: string
      - name: pgnInJson
        in: query
        description: Include each game's PGN in ndjson records.
        schema:
          default: true
          type: boolean
      - name: pgn_in_json
        in: query
        description: Alias of pgnInJson.
        schema:
          deprecated: true
          type: boolean
      - name: tokens
        in: query
        description: Comma-separated game tokens, max 300. Token lists are limited to 64 KiB. Tokens take precedence over q.
