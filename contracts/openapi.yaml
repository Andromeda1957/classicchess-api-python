                $ref: '#/components/schemas/OpeningExplorerRejection'
  /api/v1/opening-explorer/player/:
    get:
      summary: Find a player's games at a position without rendering website fragments
      description: Returns structured game rows, canonical API detail links, counts and pagination. A cold index returns 202 with pending and retry_after_ms.
      operationId: explorePlayerOpenings
      parameters:
      - name: player
        in: query
        schema:
          maxLength: 80
          type: string
      - name: fen
        in: query
        schema:
          maxLength: 100
          type: string
      - name: color
        in: query
        description: An unknown value means both.
        schema:
          default: both
          enum:
          - both
          - white
          - black
          type: string
      - name: result
        in: query
        description: The player's result; an unknown value means all.
        schema:
          default: all
          enum:
          - all
          - win
          - loss
          - draw
          type: string
      - name: page
        in: query
        schema:
          minimum: 1
          type: integer
      - name: since
        in: query
        description: Include only games from this year or later. Games with an unknown year are left out of any year range.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        description: Include only games from this year or earlier; not before since.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      responses:
        '200':
          description: Player resolution or paginated position matches. No HTML or pager fragments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerOpeningExplorer'
        '202':
          description: Position index is building; retry the newest requested position after retry_after_ms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerOpeningExplorerPending'
        '400':
          description: player is too long, page is not a positive integer, or since or until is not a year from 1400 to 9999 or since is later than until.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '422':
          description: The player has too many games for an on-demand index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '429':
          description: The index-build allowance is spent; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '503':
          description: The Master database is not connected or failed, the index could not be built, or build admission is unavailable (then honor Retry-After).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
  /api/v1/tablebase/:
    get:
      summary: Probe exact endgame tablebase results for a position
      description: Positions with at most 5 pieces use the site's local Syzygy tables when installed; 6 and 7 pieces, and smaller positions when local tables are unavailable, use the Lichess tablebase. 8-piece positions are labelled partial when Lichess answers. Positions with 9 or more pieces return covered false with a message. Each client may make 60 requests per minute.
      operationId: probeTablebase
      tags:
      - Analysis
      parameters:
      - name: fen
        in: query
        required: true
        schema:
          maxLength: 200
          type: string
      responses:
        '200':
          description: Tablebase coverage, result and per-move outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablebaseProbe'
        '400':
          description: fen is missing or is not a legal position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client exceeded the tablebase request budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/opening-explorer/sources/:
    get:
      summary: List opening explorer sources
      operationId: listOpeningExplorerSources
      responses:
        '200':
          description: Available opening explorer builds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpeningExplorerSources'
  /api/v1/opening-explorer/lichess/:
    get:
      summary: Explore a position in the Lichess opening database through this server
      description: Relays the Lichess opening explorer through this server's credentialed adapter, so clients never need a Lichess token. Without player the response covers the aggregate Lichess database; with a Lichess username it covers that player's games from the chosen color. Each client may make 60 requests per minute, and the server shares a global budget with every client.
      operationId: lichessOpeningExplorer
      tags:
      - Analysis
      parameters:
      - name: fen
        in: query
        description: Position to explore; omitted means the starting position.
        schema:
          maxLength: 100
          type: string
      - name: player
        in: query
        description: Lichess username. Blank means the aggregate Lichess database.
        schema:
          pattern: ^[A-Za-z0-9_-]{2,30}$
          type: string
      - name: color
        in: query
        description: The player's color; used only with player. both combines the player's games from each side.
        schema:
          default: both
          enum:
          - both
          - white
          - black
          type: string
      - name: result
        in: query
        description: The player's result; any value other than all requires player.
        schema:
          default: all
          enum:
          - all
          - win
          - loss
          - draw
          type: string
      - name: since
        in: query
        description: Include only games from January of this year or later.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        description: Include only games from December of this year or earlier; not before since.
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      responses:
        '200':
          description: Position count, next moves, sample Lichess games, the named opening, partial and sample_label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LichessOpeningExplorer'
        '400':
          description: The FEN, username, color, result or year range is invalid, or a result filter was sent without player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '429':
          description: The client or the shared Lichess budget is exhausted; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
        '503':
          description: The server has no Lichess credential configured, Lichess is unavailable, or admission is unavailable (then honor Retry-After).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplorerError'
  /api/v1/opening-explorer/lichess/games/{game_id}/:
    get:
      summary: Load a public Lichess game for the Opening Explorer
      description: Returns a validated PGN and game title without creating an account import. Only an eight-character game ID is accepted; the provider host is fixed. Clients at one address share 12 requests per 15 minutes, and game loading shares the existing remote-import concurrency pool.
      operationId: getLichessOpeningExplorerGame
      tags:
      - Analysis
      security: []
      parameters:
      - name: game_id
        in: path
        required: true
        description: An exact public Lichess game ID.
        schema:
          pattern: ^[A-Za-z0-9]{8}$
          type: string
      responses:
        '200':
          description: A validated public game and title.
          content:
            application/json:
              schema:
                description: One validated public Lichess game for a transient Notebook editor tab.
                properties:
                  title:
                    type: string
                  pgn:
                    type: string
                required:
                - title
                - pgn
                type: object
        '400':
          description: The game ID is invalid or query parameters were supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The game was not found or is not public.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Client budget or shared import capacity exhausted; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Provider unavailable, invalid PGN or admission unavailable; honor Retry-After when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/analysis/game-link/:
    post:
      summary: Load a Lichess or Chess.com game from its link
      description: The Analysis Board's game-link loader for API clients. Send a public Lichess or Chess.com game URL; the server fetches that one game from the provider and returns its PGN without creating an import or saving anything. Clients at one address share 12 requests per 15 minutes with the website, and provider fetches share the server-wide remote-import slots. No cookie or CSRF token is read.
      operationId: resolveGameLink
      tags:
      - Analysis
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                url:
                  description: A public Lichess or Chess.com game URL, as pasted on the Analysis Board.
                  maxLength: 500
                  type: string
              required:
              - url
              type: object
      responses:
        '200':
          description: 'The game, for one transient analysis session; Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedGameLink'
        '400':
          description: The body is not a JSON object, url is missing, not a string or longer than 500 characters, or the link does not name a public game the provider returned as valid PGN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: The request body exceeds 4096 bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client budget or the shared provider-fetch capacity is exhausted; honor Retry-After when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Provider-fetch admission is unavailable; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/stats/:
    get:
      summary: Player statistics
      description: Send either q (a free-text stats question) or player. When q is present, player and opponent are ignored; otherwise player is required, and head_to_head mode also requires opponent.
