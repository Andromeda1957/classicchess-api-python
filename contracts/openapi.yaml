components:
  schemas:
    ChessTodayDay:
      additionalProperties: false
      properties:
        date:
          description: Current site date; only present on the today endpoint.
          format: date
          type: string
        month:
          maximum: 12
          minimum: 1
          type: integer
        day:
          maximum: 31
          minimum: 1
          type: integer
        timezone:
          description: IANA timezone used for daily notification selection.
          type: string
        url:
          description: Relative API URL for this month and day.
          type: string
        featured_entry_id:
          type:
          - string
          - 'null'
        entries:
          items:
            $ref: '#/components/schemas/ChessTodayEntry'
          maxItems: 20
          type: array
      required:
      - month
      - day
      - timezone
      - url
      - featured_entry_id
      - entries
      type: object
    ChessTodayEntry:
      additionalProperties: false
      properties:
        id:
          type: string
        category:
          enum:
          - birth
          - death
          - game
          - event
          - rating_title
          - culture
          - technology
          - publication
          - rules
          type: string
        year:
          maximum: 9999
          minimum: 1
          type: integer
        text:
          description: The concise text used in daily notifications.
          maxLength: 500
          type: string
        details:
          items:
            maxLength: 500
            type: string
          maxItems: 10
          type: array
        sources:
          items:
            additionalProperties: false
            properties:
              id:
                type: string
              url:
                format: uri
                type: string
              title:
                type: string
              publisher:
                type: string
            required:
            - id
            - url
            - title
            - publisher
            type: object
          maxItems: 10
          type: array
        related:
          items:
            additionalProperties: false
            properties:
              kind:
                enum:
                - game
                - event
                - player
                - gallery
                - book
                - daily
                type: string
              identifier:
                type: string
              label:
                type: string
              url:
                type:
