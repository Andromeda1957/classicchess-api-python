  /api/v1/account/notifications/{notification_id}/:
    delete:
      summary: Dismiss one notification from the inbox
      operationId: dismissNotification
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Dismissed, with the new unread count.
