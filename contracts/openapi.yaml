                $ref: '#/components/schemas/ApiError'
        '404':
          description: A requested game token does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client exceeded the export request budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The Master database is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
