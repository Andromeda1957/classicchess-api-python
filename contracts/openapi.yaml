  /api/v1/public/games/{game_slug}/gif/:
    get:
      summary: Export one public archive game as an animated GIF
      description: 'Requires a registered account: a personal API token of any scope, a device session, or a signed-in browser. Exports share the site''s per-account GIF limit.'
      operationId: getPublicGameGif
      tags:
      - Public archive
      security:
      - AccountApiToken: &id001 []
      - MobileSessionToken: &id002 []
      parameters:
      - name: game_slug
        in: path
        required: true
        schema:
          maxLength: 255
          type: string
      - name: orientation
        in: query
        schema:
          default: white
          enum:
          - white
          - black
          type: string
      - name: format
        in: query
        description: mp4 returns the same animation as an H.264 video.
        schema:
          default: gif
          enum:
          - gif
          - mp4
          type: string
      responses:
        '200':
          description: Animated GIF attachment, or the same animation as an H.264 MP4 video with format=mp4.
          content:
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: The game cannot be rendered, or orientation or format is invalid (error code invalid_gif).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No registered account; JSON error authentication_required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Game not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: GIF export limit reached; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Export admission is temporarily unavailable; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
