        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                move:
                  description: UCI move, for example e2e4 or e7e8q.
                  type: string
                ply:
                  minimum: 0
                  type: integer
              required:
              - move
              - ply
              type: object
      responses:
        '200':
          description: The game after the move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymGameState'
        '400':
          description: Invalid or illegal move.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the gym:play scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No such game, or not the account's own game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Stale ply, not the human's turn, or the game is over.
