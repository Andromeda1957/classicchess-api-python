openapi: 3.1.0
info:
  title: Classic Chess API
  version: 1.7.0
  description: >-
    Discover curated players, approved biographies, notable games, events, chess history and annotated books;
    search the broader MasterDB; and download PGN. Public reads need no API key.
    Player, event, book and notable-game catalogs are complete lists. Game searches are paginated.
    Relative response URLs resolve against the server origin. Account automation uses scoped bearer tokens.
    Christian J. Walls' personal over-the-board games (/christian_walls/games/) are deliberately not part of
    this API; they remain on the website only.
servers:
  - url: https://classicchess.com
paths:
  /api/v1/public/chess-today/:
    get:
      summary: Today's sourced chess-history anniversaries
      description: Uses the site timezone. All reviewed entries are returned in featured order. No API key is required.
      responses:
        "200":
          description: The site date and its history entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChessTodayDay' }
        "503":
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/public/chess-today/{month}/{day}/:
    get:
      summary: Chess-history anniversaries on a specific month and day
      description: February 29 is available every year. Each entry includes its historical year. No draft or editorial review data is returned.
      parameters:
        - name: month
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: day
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 31 }
      responses:
        "200":
          description: Reviewed history entries for the requested anniversary date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChessTodayDay' }
        "404":
          description: Invalid calendar date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        "503":
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/:
    get:
      operationId: discoverApi
      summary: Discover collections, resource links, formats and pagination
      tags: [Discovery]
      responses:
        "200":
          description: Public API catalog; no authentication required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiDiscovery' }
  /api/v1/players/:
    get:
      summary: Resolve player names
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, default: 10, maximum: 50 }
      responses:
        "200":
          description: MasterDB identity and public archive player matches.
  /api/v1/stats/:
    get:
      summary: Player statistics
      parameters:
        - name: player
          in: query
          required: true
          schema: { type: string, maxLength: 80 }
        - name: mode
          in: query
          schema: { type: string, enum: [summary, head_to_head], default: summary }
        - name: opponent
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Player summary or head-to-head record.
  /api/v1/games/:
    get:
      summary: Search MasterDB games
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Paginated MasterDB game summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterGamePage' }
  /api/v1/games/export/:
    get:
      summary: Export MasterDB games
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: tokens
          in: query
          schema: { type: string, description: Comma-separated game tokens, max 300. Token lists are limited to 64 KiB. }
        - name: format
          in: query
          schema: { type: string, enum: [pgn, ndjson], default: pgn }
        - name: pgnInJson
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: PGN bundle or newline-delimited JSON, at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
    post:
      summary: Export MasterDB games by token body
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 65536, description: Comma- or newline-separated game tokens, max 300. }
      responses:
        "200":
          description: PGN bundle or newline-delimited JSON, at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
  /api/v1/games/{token}/:
    get:
      summary: Get one MasterDB game
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: One game with PGN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MasterGameDetail' }
  /api/v1/games/{token}/pgn/:
    get:
      summary: Get one MasterDB PGN
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Raw PGN.
          content:
            application/x-chess-pgn:
              schema: { type: string }
  /api/v1/games/{token}/gif/:
    get:
      summary: Export one MasterDB game as an animated GIF
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
        - name: orientation
          in: query
          schema: { type: string, enum: [white, black], default: white }
      description: >-
        Requires a registered account: a personal API token of any scope, a device session, or a
        signed-in browser.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      responses:
        "200":
          description: Animated GIF.
          content:
            image/gif:
              schema: { type: string, format: binary }
        "401":
          description: A registered account is required.
        "429":
          description: GIF export rate limit exceeded.
  /api/v1/public/players/:
    get:
      operationId: listCuratedPlayers
      summary: List every curated player, including approved biographies and resource links
      description: >-
        A complete unpaginated catalog of players with archived games. JSON is the default
        and preserves the existing profile fields. Use format=txt for names only, one per line.
        A missing or withheld biography is null. Follow urls.api_detail, urls.api_bio,
        urls.api_notable_games, urls.api_games and urls.api_pgn to explore a player.
      tags: [Curated players]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - $ref: '#/components/parameters/CatalogFormat'
        - name: bucket
          in: query
          description: Archive era key returned in archive_buckets. An unknown key selects all eras.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: Complete public player catalog or UTF-8 names, one per line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlayers' }
            text/plain:
              schema: { type: string, example: "Mikhail Tal\nJosé Raúl Capablanca\n" }
        "400": { $ref: '#/components/responses/InvalidQuery' }
  /api/v1/public/players/{player_slug}/:
    get:
      operationId: getCuratedPlayer
      tags: [Curated players]
      summary: Get one curated player profile, approved biography, portrait and links
      parameters:
        - $ref: '#/components/parameters/PlayerSlug'
      responses:
        "200":
          description: One public profile. bio is null when unavailable; bookmarked belongs to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlayerDetail' }
        "404": { $ref: '#/components/responses/PublicPlayerNotFound' }
  /api/v1/public/players/{player_slug}/bio/:
    get:
      operationId: getCuratedPlayerBiography
      tags: [Curated players]
      summary: Read an approved player biography, structured sections, quotes and sources
      parameters:
        - $ref: '#/components/parameters/PlayerSlug'
      responses:
        "200":
          description: Player identity plus bio. Both absent and withheld biographies return bio null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPlayerBiography' }
        "404": { $ref: '#/components/responses/PublicPlayerNotFound' }
  /api/v1/public/players/{player_slug}/notable-games/:
    get:
      operationId: listCuratedNotableGames
      tags: [Curated players]
      summary: List a player's curated notable games, in editorial order
      description: >-
        Complete unpaginated list. Each entry has its one-based position, editorial title,
        annotation and a game summary with canonical detail and PGN URLs. The annotation
        explains the selection; it is not move-by-move commentary. An empty selection
        returns count 0 and results []. Only public games belonging to this player appear.
      parameters:
        - $ref: '#/components/parameters/PlayerSlug'
      responses:
        "200":
          description: Ordered notable-game selection with canonical game tokens and URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicNotableGames' }
        "404": { $ref: '#/components/responses/PublicPlayerNotFound' }
  /api/v1/public/event-series/:
    get:
      operationId: listEventSeries
      tags: [Curated events]
      summary: Browse event-series cards, select a series, or search events
      description: Complete catalog. Supply either q or series; omit both for series cards, including Matches and Misc.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: series
          in: query
          schema: { type: string, maxLength: 160, pattern: '^[a-z0-9-]+$' }
      responses:
        "200":
          description: Series cards or their member events, in archive order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventIndex' }
        "400": { $ref: '#/components/responses/InvalidQuery' }
        "404":
          description: The series does not exist.
  /api/v1/public/events/:
    get:
      operationId: listCuratedEvents
      tags: [Curated events]
      summary: List every public study-event archive
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
          description: Filter by event name, slug, series, site, source label, or year.
        - $ref: '#/components/parameters/CatalogFormat'
      responses:
        "200":
          description: Complete public event inventory with canonical metadata, counts, and links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEvents' }
            text/plain:
              schema: { type: string, description: Complete list of names, one per line. }
        "400": { $ref: '#/components/responses/InvalidQuery' }
  /api/v1/public/events/{event_slug}/:
    get:
      operationId: getCuratedEvent
      tags: [Curated events]
      summary: Get one public study-event archive with canonical metadata and links
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      responses:
        "200":
          description: One event with counts, series, source labels and API/HTML links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventDetail' }
        "404": { $ref: '#/components/responses/PublicEventNotFound' }
  /api/v1/public/events/{event_slug}/about/:
    get:
      operationId: getCuratedEventAbout
      tags: [Curated events]
      summary: Read an event's about page, write-up, photographs, vitals and cross table
      description: >-
        The same facts as the event's HTML about page. bio is null when no write-up exists;
        auto_vitals are always computed from the archive. crosstable is null when the event
        has no computable table, and otherwise has kind match, tournament, team or incomplete.
        Image URLs are absolute.
      parameters:
        - $ref: '#/components/parameters/EventSlug'
      responses:
        "200":
          description: Event identity plus about-page content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEventAbout' }
        "404": { $ref: '#/components/responses/PublicEventNotFound' }
  /api/v1/public/gallery/:
    get:
      operationId: listGalleryPhotos
      tags: [Gallery]
      summary: Browse or search the historical photograph gallery with attribution
      description: >-
        Paginated in catalog order. q matches players, events, places, scenes, dates and
        sources, like the gallery page. Every photograph carries its source, license and
        credit; reuse must honor attribution.required and usage_terms. Image URLs are absolute.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: Values above 100 are clamped to 100.
          schema: { type: integer, minimum: 1, default: 48 }
      responses:
        "200":
          description: One page of photographs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryPage' }
        "400": { $ref: '#/components/responses/InvalidQuery' }
        "404":
          description: page is past the last page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/public/gallery/{photo_id}/:
    get:
      operationId: getGalleryPhoto
      tags: [Gallery]
      summary: Get one gallery photograph with its source, license and credit
      parameters:
        - name: photo_id
          in: path
          required: true
          schema: { type: string, maxLength: 160 }
      responses:
        "200":
          description: One photograph.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GalleryPhotoDetail' }
        "404":
          description: No photograph with this ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/public/beginner-games/:
    get:
      operationId: getBeginnerGames
      tags: [Curated games]
      summary: Read the ordered beginner games guide
      description: Complete ordered curriculum. Each entry has a one-based step, its study focus, and a spoiler-free game summary.
      responses:
        "200":
          description: Guide stages in teaching order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicBeginnerGames' }
        "503":
          description: The checked-in curriculum cannot currently be published.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/public/daily/:
    get:
      operationId: getDailyGame
      tags: [Curated games]
      summary: Get today's Game of the Day
      description: >-
        The same frozen daily pick the /daily/ page redirects to, as spoiler-free identity:
        the descriptor names the players, result and event without moves. game is null when
        no daily game can be published. Fetch urls.api_detail for PGN and mainline.
      responses:
        "200":
          description: The server date and today's game.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicDailyGame' }
  /api/v1/public/search/:
    get:
      operationId: searchSite
      tags: [Search]
      summary: Search the curated archive like the site search box
      description: >-
        Without kind, returns the grouped preview the site search overlay shows: counts plus
        the first players, events and games. With kind, returns one 50-row page of that
        result kind. Queries may name one player, two players (a matchup), an event, or
        general game terms, optionally with a year.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 120 }
          description: At most 8 searchable terms.
        - name: kind
          in: query
          schema: { type: string, enum: [games, events, players] }
        - name: page
          in: query
          description: Requires kind. Pages past the end return the last page.
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Grouped preview, or one page of a result kind when kind is supplied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SiteSearchPreview'
                  - $ref: '#/components/schemas/SiteSearchPage'
        "400": { $ref: '#/components/responses/InvalidQuery' }
  /api/v1/public/games/:
    get:
      operationId: listPublicGames
      tags: [Public archive]
      summary: Search player- and event-backed public archive games
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: archive_player
          in: query
          schema: { type: string, maxLength: 80 }
        - name: archive_event
          in: query
          schema: { type: string, maxLength: 255 }
          description: Event slug returned by the public events endpoint.
        - name: since
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
        - name: until
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
        - name: sort
          in: query
          schema: { type: string, enum: [asc, desc, event], default: asc }
          description: event preserves curated round order and requires archive_event.
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Paginated public archive game summaries, including event-only games. Returned navigable URLs use the shared canonical game record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGamePage' }
        "400": { $ref: '#/components/responses/InvalidQuery' }
  /api/v1/public/games/{game_slug}/:
    get:
      operationId: getPublicGame
      tags: [Public archive]
      summary: Canonical public archive game detail
      parameters:
        - name: game_slug
          in: path
          required: true
          schema: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Public game detail with archive memberships, PGN, and mainline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGame' }
        "404":
          description: Game is not in a public player or event archive.
  /api/v1/public/games/{game_slug}/pgn/:
    get:
      summary: Canonical public archive game PGN
      parameters:
        - name: game_slug
          in: path
          required: true
          schema: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Sanitized public PGN as text/plain.
          content:
            text/plain:
              schema: { type: string }
  /api/v1/public/games/{game_slug}/gif/:
    get:
      operationId: getPublicGameGif
      tags: [Public archive]
      summary: Export one public archive game as an animated GIF
      description: >-
        Requires a registered account: a personal API token of any scope, a device session, or a
        signed-in browser. Exports share the site's per-account GIF limit.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      parameters:
        - { name: game_slug, in: path, required: true, schema: { type: string, maxLength: 255 } }
        - { name: orientation, in: query, schema: { type: string, enum: [white, black], default: white } }
      responses:
        "200":
          description: Animated GIF attachment.
          content:
            image/gif:
              schema: { type: string, format: binary }
        "400":
          description: The game cannot be rendered as a GIF (error code invalid_gif).
        "401":
          description: No registered account; JSON error authentication_required.
        "404":
          description: Game not found.
        "429":
          description: GIF export limit reached; honor Retry-After.
  /api/v1/public/imported-games/{username}/{game_slug}/:
    get:
      operationId: getPublicImportedGame
      tags: [Public archive]
      summary: A game another account imported and shared publicly
      description: >-
        Lookup only, by the username and slug in the game's page address; other accounts' imports
        are never listed. Private imports return 404 to every caller, including their owner, who uses
        /api/v1/account/imported-games/ instead.
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, maxLength: 150 } }
        - { name: game_slug, in: path, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: Imported game detail with the importer's username, PGN, mainline and links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicImportedGame' }
        "404":
          description: No public import with that username and slug.
  /api/v1/public/imported-games/{username}/{game_slug}/pgn/:
    get:
      operationId: getPublicImportedGamePgn
      tags: [Public archive]
      summary: PGN of a publicly shared imported game
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, maxLength: 150 } }
        - { name: game_slug, in: path, required: true, schema: { type: string, maxLength: 255 } }
      responses:
        "200":
          description: The same PGN text the game page downloads.
          content:
            application/x-chess-pgn:
              schema: { type: string }
        "404":
          description: No public import with that username and slug.
  /api/v1/public/imported-games/{username}/{game_slug}/gif/:
    get:
      operationId: getPublicImportedGameGif
      tags: [Public archive]
      summary: Export a publicly shared imported game as an animated GIF
      description: >-
        Requires a registered account: a personal API token of any scope, a device session, or a
        signed-in browser. Exports share the site's per-account GIF limit.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, maxLength: 150 } }
        - { name: game_slug, in: path, required: true, schema: { type: string, maxLength: 255 } }
        - { name: orientation, in: query, schema: { type: string, enum: [white, black], default: white } }
      responses:
        "200":
          description: Animated GIF attachment.
          content:
            image/gif:
              schema: { type: string, format: binary }
        "400":
          description: The game cannot be rendered as a GIF (error code invalid_gif).
        "401":
          description: No registered account; JSON error authentication_required.
        "404":
          description: Game not found.
        "429":
          description: GIF export limit reached; honor Retry-After.
  /api/v1/public/games/export/:
    get:
      summary: Export player- and event-backed public archive games
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: archive_player
          in: query
          schema: { type: string }
        - name: archive_event
          in: query
          schema: { type: string, maxLength: 255 }
        - name: since
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
        - name: until
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
        - name: tokens
          in: query
          schema: { type: string, description: "Comma-separated canonical game_slug or legacy player_slug/game_slug tokens, max 300. Token lists are limited to 64 KiB." }
        - name: format
          in: query
          schema: { type: string, enum: [pgn, ndjson], default: pgn }
        - name: pgnInJson
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: PGN bundle or newline-delimited JSON, at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
    post:
      summary: Export public archive games by canonical or compatibility token body
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 65536, description: Comma- or newline-separated canonical game_slug or legacy player_slug/game_slug tokens, max 300. }
      responses:
        "200":
          description: PGN bundle or newline-delimited JSON, at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
  /api/v1/annotated/books/:
    get:
      operationId: listAnnotatedBooks
      tags: [Annotated books]
      summary: List every annotated book, with source metadata and download links
      parameters:
        - $ref: '#/components/parameters/CatalogFormat'
      responses:
        "200":
          description: Complete unpaginated catalog, or book titles only with format=txt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnotatedBooks' }
            text/plain:
              schema: { type: string, description: One book title per line. }
        "400": { $ref: '#/components/responses/InvalidQuery' }
  /api/v1/annotated/books/{book_slug}/games/:
    get:
      summary: List games in an annotated book
      parameters:
        - name: book_slug
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Paginated annotated games.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnotatedGamePage' }
  /api/v1/annotated/books/{book_slug}/pgn/:
    get:
      summary: Export all games in an annotated book as PGN
      parameters:
        - name: book_slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw PGN bundle.
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/:
    get:
      summary: Get one annotated game
      parameters:
        - name: book_slug
          in: path
          required: true
          schema: { type: string }
        - name: game_slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One annotated game with PGN and annotation notes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnotatedGame' }
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/pgn/:
    get:
      summary: Get one annotated game as PGN
      parameters:
        - name: book_slug
          in: path
          required: true
          schema: { type: string }
        - name: game_slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw annotated PGN with source headers and comments.
          content:
            application/x-chess-pgn:
              schema: { type: string }
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/gif/:
    get:
      operationId: getAnnotatedGameGif
      tags: [Annotated books]
      summary: Export one annotated book game as an animated GIF
      description: >-
        Requires a registered account: a personal API token of any scope, a device session, or a
        signed-in browser. Exports share the site's per-account GIF limit.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      parameters:
        - { name: book_slug, in: path, required: true, schema: { type: string } }
        - { name: game_slug, in: path, required: true, schema: { type: string } }
        - { name: orientation, in: query, schema: { type: string, enum: [white, black], default: white } }
      responses:
        "200":
          description: Animated GIF attachment.
          content:
            image/gif:
              schema: { type: string, format: binary }
        "400":
          description: The game cannot be rendered as a GIF (error code invalid_gif).
        "401":
          description: No registered account; JSON error authentication_required.
        "404":
          description: Game not found.
        "429":
          description: GIF export limit reached; honor Retry-After.
  /api/v1/opening-explorer/:
    get:
      summary: Explore an opening position
      parameters:
        - name: fen
          in: query
          schema: { type: string }
        - name: play
          in: query
          schema: { type: string, maxLength: 512, description: Comma-separated UCI moves to play from fen, max 100 moves. }
        - name: moves
          in: query
          schema: { type: integer, default: 12, maximum: 50 }
        - name: topGames
          in: query
          schema: { type: integer, default: 15, maximum: 15 }
        - name: since
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
          description: Include only games from this year or later when the source supports year indexes.
        - name: until
          in: query
          schema: { type: integer, minimum: 1400, maximum: 9999 }
          description: Include only games from this year or earlier when the source supports year indexes.
        - name: source_type
          in: query
          schema: { type: string }
        - name: source_key
          in: query
          schema: { type: string }
          description: Public source key returned by the sources endpoint; the master database key is masterdb.
      responses:
        "200":
          description: Position totals, moves, and top reference games.
  /api/v1/opening-explorer/player/:
    get:
      summary: Find a player's games at a position without rendering website fragments
      description: Returns structured game rows, canonical API detail links, counts and pagination. A cold index returns 202 with pending and retry_after_ms.
      parameters:
        - name: player
          in: query
          schema: { type: string, maxLength: 80 }
        - name: fen
          in: query
          schema: { type: string, maxLength: 100 }
        - name: color
          in: query
          schema: { type: string, enum: [both, white, black] }
        - name: result
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Player resolution or paginated position matches. No HTML or pager fragments.
        "202":
          description: Position index is building; retry the newest requested position after retry_after_ms.
  /api/v1/opening-explorer/sources/:
    get:
      summary: List opening explorer sources
      responses:
        "200":
          description: Available opening explorer builds.
  /api/v1/tablebase/:
    get:
      operationId: probeTablebase
      tags: [Analysis]
      summary: Probe exact endgame tablebase results for a position
      description: >-
        Positions with at most 5 pieces use the site's local Syzygy tables when installed;
        6 and 7 pieces, and smaller positions when local tables are unavailable, use the
        Lichess tablebase. 8-piece positions are labelled partial when Lichess answers.
        Positions with 9 or more pieces return covered false with a message. Each client
        may make 60 requests per minute.
      parameters:
        - name: fen
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Tablebase coverage, result and per-move outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TablebaseProbe' }
        "400":
          description: fen is missing or is not a legal position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        "429":
          description: The client exceeded the tablebase request budget.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/mobile/home/:
    get:
      summary: Native mobile home payload
      responses:
        "200":
          description: Front-door counts, Game of the Day, and native app action links.
  /api/v1/mobile/android/release/:
    get:
      summary: Native Android release metadata
      responses:
        "200":
          description: Version code/name, APK URL, SHA-256 checksum, and size.
  /api/v1/account/mobile/login/:
    post:
      summary: Native mobile username/password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 150 }
                password: { type: string }
                two_factor_code: { type: string, description: Authenticator or recovery code when required. }
                device_name: { type: string, maxLength: 80 }
      responses:
        "201":
          description: Mobile session bearer credential and account summary.
        "400":
          description: Invalid JSON request.
        "401":
          description: Invalid credentials, two_factor_required, or invalid_two_factor.
  /api/v1/account/mobile/logout/:
    post:
      summary: Revoke the current native mobile session
      security:
        - MobileSessionToken: []
      responses:
        "200":
          description: Mobile session revoked.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
  /api/v1/account/mobile/sessions/:
    get:
      summary: List the account's active native device sessions
      security:
        - MobileSessionToken: []
      responses:
        "200":
          description: Owner-scoped device names, timestamps, expiry, and current-session marker.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
  /api/v1/account/mobile/sessions/{session_id}/revoke/:
    post:
      summary: Revoke one account-owned native device session
      security:
        - MobileSessionToken: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Device session revoked.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
        "404":
          description: Device session is inactive or does not belong to the account.
  /api/v1/account/mobile/sessions/revoke-all/:
    post:
      summary: Revoke every native device session for the account
      security:
        - MobileSessionToken: []
      responses:
        "200":
          description: All account-owned device sessions, including the caller, were revoked.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
  /api/v1/account/mobile/settings/:
    get:
      summary: Native mobile account settings
      security:
        - MobileSessionToken: []
      responses:
        "200":
          description: Board theme, piece set, and engine preferences from account settings.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
    post:
      summary: Update native mobile board or engine settings
      security:
        - MobileSessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                board_theme: { type: string }
                piece_set: { type: string }
                engine_depth: { type: integer }
                engine_lines: { type: integer, minimum: 1, maximum: 5 }
                engine_eval_bar: { type: boolean }
                engine_enabled: { type: boolean }
      responses:
        "200":
          description: Updated account settings payload.
        "400":
          description: Invalid preference or request body.
        "401":
          description: Missing, invalid, expired, or revoked mobile session.
  /api/v1/account/me/:
    get:
      summary: Authenticated account summary
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [account:read]
      responses:
        "200":
          description: Current account username, email, and email verification state.
        "401":
          description: Missing, invalid, expired, or revoked bearer token.
        "403":
          description: Token is missing the required scope.
  /api/v1/account/collections/:
    get:
      summary: List account collections
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      responses:
        "200":
          description: Account collections with game counts.
    post:
      summary: Create an account collection
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Created collection.
        "400":
          description: Validation error.
  /api/v1/account/collections/{collection_id}/:
    get:
      summary: List owned collection games
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - in: path
          name: collection_id
          required: true
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: sort
          schema: { type: string }
      responses:
        "200":
          description: Paginated collection games.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Collection not found for this account.
    patch:
      summary: Rename an owned collection
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: collection_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Updated collection.
        "400":
          description: Validation error.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Collection not found for this account.
    delete:
      summary: Delete an owned collection
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: collection_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Collection deleted.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Collection not found for this account.
  /api/v1/account/collections/{collection_id}/items/{item_id}/:
    delete:
      summary: Remove a game from an owned collection
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: collection_id
          required: true
          schema: { type: integer }
        - in: path
          name: item_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Game removed from collection.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Collection not found for this account.
  /api/v1/account/collections/{collection_id}/items/:
    post:
      summary: Add one game to an owned collection
      description: >-
        game is a game slug the caller can open: any public archive game, a public imported
        game, or one of the caller's own imports. Adding a game already in the collection is
        not an error; it returns 200 with changed false. Safe to retry.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: collection_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game]
              additionalProperties: false
              properties:
                game: { type: string, minLength: 1, description: Game slug, such as urls.api_detail's last segment. }
      responses:
        "201":
          description: Game added; the new collection item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCollectionItem' }
        "200":
          description: Game was already in the collection; the existing item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountCollectionItem' }
        "400":
          description: Body is not exactly one game slug.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Collection not found for this account, or no game the caller can open has this slug.
  /api/v1/account/collections/import/:
    post:
      summary: Import public archive player games into an account collection
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, archive_player]
              properties:
                source: { type: string, enum: [public_player_games] }
                name: { type: string, maxLength: 120, description: Collection name to create or reuse when collection_id is omitted. }
                collection_id: { type: integer, description: Existing account collection ID. }
                archive_player: { type: string, maxLength: 80 }
                since: { type: integer, minimum: 1400, maximum: 9999 }
                until: { type: integer, minimum: 1400, maximum: 9999 }
      responses:
        "200":
          description: Import counts and collection metadata.
        "400":
          description: Validation error.
  /api/v1/account/imported-games/:
    get:
      summary: List or search owned imported games
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated imported-game summaries and quota.
    post:
      summary: Import an account-owned game
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [pgn, lichess, chesscom] }
                pgn: { type: string }
                remote_url: { type: string, format: uri }
                visibility: { type: string, enum: [private, public] }
      responses:
        "201":
          description: Imported game with PGN and board-ready mainline.
        "400":
          description: Invalid import, quota, provider URL, or request body.
  /api/v1/account/imported-games/{slug}/:
    get:
      summary: Owned imported-game detail
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Imported game detail with PGN and board-ready mainline.
        "404":
          description: Imported game not found for this account.
    patch:
      summary: Change an owned imported game's visibility
      description: >-
        Public games are visible to everyone and can be starred or collected by other accounts.
        Making a game private hides it from other accounts' collections and starred lists
        without deleting their references. Safe to retry.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              additionalProperties: false
              properties:
                visibility: { type: string, enum: [private, public] }
      responses:
        "200":
          description: Updated imported game detail; changed is false when visibility already matched.
        "400":
          description: Body is not exactly one supported visibility.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Imported game not found for this account.
    delete:
      summary: Permanently delete an owned imported game
      description: Also removes it from every collection and starred list that referenced it. This cannot be undone.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Imported game deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, slug, message]
                properties:
                  deleted: { const: true }
                  slug: { type: string }
                  message: { type: string }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Imported game not found for this account.
  /api/v1/account/imported-games/{slug}/gif/:
    get:
      summary: Export an owned imported game as an animated GIF
      description: Either visibility. Shares the site's per-account GIF limit.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: orientation, in: query, schema: { type: string, enum: [white, black], default: white } }
      responses:
        "200":
          description: Animated GIF attachment.
          content:
            image/gif:
              schema: { type: string, format: binary }
        "400":
          description: The game cannot be rendered as a GIF.
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Imported game not found for this account.
        "429":
          description: GIF export limit reached; honor Retry-After.
  /api/v1/account/notifications/:
    get:
      summary: The account's notification inbox
      description: Newest first, as the website inbox lists them. unread_count matches the website bell.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:read]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: One inbox page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationPage' }
        "400":
          description: Invalid page or page_size.
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
  /api/v1/account/notifications/read-all/:
    post:
      summary: Mark every inbox notification read
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:write]
      responses:
        "200":
          description: The number marked and the new unread count. Safe to retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationChange' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
  /api/v1/account/notifications/preferences/:
    get:
      summary: Per-topic on-site notification choices and sound
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:read]
      responses:
        "200":
          description: Every topic with its effective choice and default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationPreferences' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
    patch:
      summary: Change some notification choices
      description: >-
        Only the topics and sound setting named change; every other topic keeps its current
        effective choice.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                topics:
                  type: object
                  description: Topic keys from GET mapped to true or false.
                  additionalProperties: { type: boolean }
                sound_enabled: { type: boolean }
      responses:
        "200":
          description: The updated preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationPreferences' }
        "400":
          description: Unknown topic or non-boolean value; nothing changed.
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
  /api/v1/account/notifications/{notification_id}/:
    delete:
      summary: Dismiss one notification from the inbox
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:write]
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Dismissed, with the new unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationChange' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Not in this account's inbox.
  /api/v1/account/notifications/{notification_id}/read/:
    post:
      summary: Mark one notification read
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notifications:write]
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Marked read (safe to retry), with the new unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotificationChange' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Not in this account's inbox.
  /api/v1/account/notebooks/:
    get:
      summary: Notebooks the account owns or was invited to
      description: The same set as My Notebooks, most recently updated first.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notebooks:read]
      responses:
        "200":
          description: Notebook summaries with export links.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotebooks' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
  /api/v1/account/notebooks/{notebook_uuid}/:
    get:
      summary: One Notebook's folders and chapters
      description: >-
        Any Notebook the account can open, including public and unlisted Notebooks it is not a member
        of. Chapter api_pgn links are empty when this account cannot export the Notebook.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notebooks:read]
      parameters:
        - { name: notebook_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Notebook summary, sections and chapters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountNotebookDetail' }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Notebook not found or not visible to this account.
  /api/v1/account/notebooks/{notebook_uuid}/file/:
    get:
      summary: Download the whole Notebook as a .ccnb file
      description: >-
        Members may always export. Other accounts may export only when the owner allowed public
        exports.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notebooks:read]
      parameters:
        - { name: notebook_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Unencrypted Classic Chess Notebook file.
          content:
            application/vnd.classicchess.notebook:
              schema: { type: string, format: binary }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Notebook not found, not visible, or not exportable by this account.
    post:
      summary: Download the Notebook as a password-protected .ccnb file
      description: Members only. The password encrypts this one file and is not stored.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notebooks:read]
      parameters:
        - { name: notebook_uuid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              additionalProperties: false
              properties:
                password: { type: string, minLength: 1 }
      responses:
        "200":
          description: Encrypted Classic Chess Notebook file.
          content:
            application/vnd.classicchess.notebook:
              schema: { type: string, format: binary }
        "400":
          description: Missing or unacceptable password.
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Notebook not found, or the account is not a member.
  /api/v1/account/notebooks/{notebook_uuid}/chapters/{chapter_id}/pgn/:
    get:
      summary: Download one Notebook chapter as PGN
      description: The same export rule as the whole-Notebook file.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [notebooks:read]
      parameters:
        - { name: notebook_uuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: chapter_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chapter PGN attachment.
          content:
            application/x-chess-pgn:
              schema: { type: string }
        "401":
          description: Missing or invalid bearer token. Browser cookie sessions are not accepted.
        "403":
          description: Personal API token is missing the required scope.
        "404":
          description: Notebook or chapter not found, or not exportable by this account.
  /api/v1/account/starred/players/:
    get:
      summary: List the account's starred players
      description: Most recently starred first.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated starred players.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarredPlayers' }
        "400":
          description: Invalid pagination.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
  /api/v1/account/starred/players/{player_slug}/:
    put:
      summary: Star a public archive player
      description: Idempotent. Starring an already starred player returns changed false.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - $ref: '#/components/parameters/PlayerSlug'
      responses:
        "200":
          description: Resulting star state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarState' }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Player has no public archive.
    delete:
      summary: Unstar a public archive player
      description: Idempotent. Unstarring a player that is not starred returns changed false.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - $ref: '#/components/parameters/PlayerSlug'
      responses:
        "200":
          description: Resulting star state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarState' }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: Player has no public archive.
  /api/v1/account/starred/games/:
    get:
      summary: List the account's starred games
      description: >-
        Most recently starred first. A starred game another account imported and later made
        private is omitted.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:read]
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Paginated starred games.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarredGames' }
        "400":
          description: Invalid pagination.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
  /api/v1/account/starred/games/{game_slug}/:
    put:
      summary: Star a game the caller can open
      description: Idempotent. Any public archive game, public imported game, or the caller's own import can be starred.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - { in: path, name: game_slug, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resulting star state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarState' }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: No game the caller can open has this slug.
    delete:
      summary: Unstar a game
      description: Idempotent. A game the caller already starred can be unstarred even after its importer made it private.
      security:
        - AccountApiToken: []
        - MobileSessionToken: []
      x-required-scopes: [library:write]
      parameters:
        - { in: path, name: game_slug, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resulting star state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStarState' }
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: Token is missing the required scope.
        "404":
          description: No such game is starred or openable by the caller.
  /api/v1/public/games/{player_slug}/{game_slug}/:
    get:
      summary: Compatibility URL for a game in a player's archive
      description: Prefer the canonical game URL from urls.api_detail. This older URL remains supported for installed clients and validates player membership.
      x-audience: compatibility
      parameters:
        - { name: player_slug, in: path, required: true, schema: { type: string } }
        - { name: game_slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public game detail, including PGN and mainline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicGame' }
        "404": { description: No public game belonging to this player. }
  /api/v1/public/games/{player_slug}/{game_slug}/pgn/:
    get:
      summary: Compatibility PGN URL for a player's game
      x-audience: compatibility
      parameters:
        - { name: player_slug, in: path, required: true, schema: { type: string } }
        - { name: game_slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sanitized public PGN.
          content:
            text/plain:
              schema: { type: string }
        "404": { description: No public game belonging to this player. }
  /api/v1/account/players/{player_slug}/bookmark/:
    post:
      summary: Toggle a player bookmark for the authenticated library owner
      security: [{ AccountApiToken: [] }, { MobileSessionToken: [] }]
      description: Personal tokens require library:write. Device sessions are also accepted. This operation toggles state; do not automatically retry it.
      parameters:
        - { name: player_slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Resulting bookmark state.
          content:
            application/json:
              schema:
                type: object
                required: [ok, slug, bookmarked, message]
                properties:
                  ok: { type: boolean }
                  slug: { type: string }
                  bookmarked: { type: boolean }
                  message: { type: string }
        "401": { description: Missing or invalid token. }
        "403": { description: Token does not have library:write. }
        "404": { description: Player has no public archive. }
components:
  parameters:
    CatalogFormat:
      name: format
      in: query
      description: JSON metadata by default; txt returns only the complete list of names or titles.
      schema: { type: string, enum: [json, txt], default: json }
    PlayerSlug:
      name: player_slug
      in: path
      required: true
      description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
      schema: { type: string, example: mikhail-tal }
    EventSlug:
      name: event_slug
      in: path
      required: true
      description: Exact slug from the curated-event catalog.
      schema: { type: string, example: wcc-1972-fischer-spassky }
  responses:
    InvalidQuery:
      description: Query exceeds its bounds or requests an unsupported format.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PublicPlayerNotFound:
      description: No public player archive with this slug and at least one archived game.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PublicEventNotFound:
      description: No public study event with this slug.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ChessTodayDay:
      type: object
      additionalProperties: false
      required: [month, day, timezone, url, featured_entry_id, entries]
      properties:
        date: { type: string, format: date, description: Current site date; only present on the today endpoint. }
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
        timezone: { type: string, description: IANA timezone used for daily notification selection. }
        url: { type: string, description: Relative API URL for this month and day. }
        featured_entry_id: { type: [string, 'null'] }
        entries:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ChessTodayEntry' }
    ChessTodayEntry:
      type: object
      additionalProperties: false
      required: [id, category, year, text, details, sources, related, target_url, photograph]
      properties:
        id: { type: string }
        category: { type: string, enum: [birth, death, game, event, rating_title, culture, technology, publication, rules] }
        year: { type: integer, minimum: 1, maximum: 9999 }
        text: { type: string, maxLength: 500, description: The concise text used in daily notifications. }
        details:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 500 }
        sources:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [id, url, title, publisher]
            properties:
              id: { type: string }
              url: { type: string, format: uri }
              title: { type: string }
              publisher: { type: string }
        related:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [kind, identifier, label, url]
            properties:
              kind: { type: string, enum: [game, event, player, gallery, book, daily] }
              identifier: { type: string }
              label: { type: string }
              url: { type: [string, 'null'], description: Relative public URL; null when the related public item is unavailable. }
        target_url: { type: string, description: Notification destination; a public archive item or this date's JSON as fallback. }
        photograph:
          type: [object, 'null']
          additionalProperties: false
          description: A photograph with a verified event association, when available.
          required: [image_url, gallery_url, alt_text, credit, artist, source_name, source_url, license, license_url, width, height]
          properties:
            image_url: { type: string }
            gallery_url: { type: string }
            alt_text: { type: string }
            credit: { type: string }
            artist: { type: string }
            source_name: { type: string }
            source_url: { type: string, format: uri }
            license: { type: string }
            license_url: { type: string }
            width: { type: integer }
            height: { type: integer }
    MasterGame:
      type: object
      description: MasterDB search metadata. Tokens identify MasterDB games, not curated archive slugs.
      required: [token, white, black, display_white, display_black, result, event, site, date, played_on, year, round, white_elo, black_elo, eco, opening, ply_count, move_count, source_count, urls]
      properties:
        token: { type: string, pattern: '^g[0-9a-z]+-[0-9a-f]{12}$', maxLength: 80 }
        white: { type: string }
        black: { type: string }
        display_white: { type: string }
        display_black: { type: string }
        result: { type: string }
        event: { type: string }
        site: { type: string }
        date: { type: string }
        played_on: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        round: { type: string }
        white_elo: { type: [integer, 'null'] }
        black_elo: { type: [integer, 'null'] }
        eco: { type: string }
        opening: { type: string }
        ply_count: { type: [integer, 'null'] }
        move_count: { type: [integer, 'null'] }
        source_count: { type: integer }
        urls: { $ref: '#/components/schemas/ResourceLinks' }
    MasterGameDetail:
      allOf:
        - $ref: '#/components/schemas/MasterGame'
        - type: object
          required: [pgn, mainline]
          properties:
            pgn: { type: string }
            mainline: { type: object }
    MasterGamePage:
      type: object
      required: [query, count, page, page_size, page_count, count_is_exact, result_limit, hit_result_limit, next, previous, message, hint, results]
      properties:
        query: { type: string }
        count: { type: integer, description: Lower bound unless count_is_exact is true. }
        page: { type: integer }
        page_size: { type: integer }
        page_count: { type: integer, description: Known pages so far; follow next rather than assuming an exact total. }
        count_is_exact: { type: boolean }
        result_limit: { type: integer }
        hit_result_limit: { type: boolean, description: Search stopped at the server result limit; refine the query. }
        next: { type: [string, 'null'] }
        previous: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        hint: { type: string }
        results:
          type: array
          items: { $ref: '#/components/schemas/MasterGame' }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    ApiDiscovery:
      type: object
      required: [name, version, authentication, documentation, collections, player_resources, tools, pagination]
      properties:
        name: { type: string }
        version: { type: string, const: v1 }
        authentication: { type: object }
        documentation: { $ref: '#/components/schemas/ResourceLinks' }
        collections:
          type: object
          additionalProperties:
            type: object
            required: [url, description, paginated]
            properties:
              url: { type: string }
              text_url: { type: string }
              description: { type: string }
              paginated: { type: boolean }
        player_resources: { type: object }
        tools: { $ref: '#/components/schemas/ResourceLinks' }
        pagination: { type: object }
    ResourceLinks:
      type: object
      description: Follow these links. Paths beginning with / resolve against the API origin.
      additionalProperties: { type: [string, 'null'] }
    PlayerIdentity:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
    Biography:
      type: [object, 'null']
      description: Approved biography only. Render prose and quotes as text, not trusted HTML.
      required: [epithet, lifespan, crown, lede, vitals, sections, numbers, quotes_by, quotes_about, legacy, sources]
      properties:
        epithet: { type: string }
        lifespan: { type: string }
        crown: { type: string }
        lede: { type: string }
        vitals:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              heading: { type: string }
              body: { type: array, items: { type: string } }
        numbers:
          type: array
          items: { type: object }
        quotes_by:
          type: array
          items: { $ref: '#/components/schemas/BiographyQuote' }
        quotes_about:
          type: array
          items: { $ref: '#/components/schemas/BiographyQuote' }
        legacy: { type: string }
        sources:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              url: { type: string }
    BiographyQuote:
      type: object
      properties:
        text: { type: string }
        source: { type: string }
    PublicPlayer:
      allOf:
        - $ref: '#/components/schemas/PlayerIdentity'
        - type: object
          required: [archive_bucket, game_count, archive_years, bookmarked, criteria, portrait, bio, urls]
          properties:
            archive_bucket:
              type: object
              properties:
                key: { type: string }
                label: { type: string }
            game_count: { type: integer, minimum: 1 }
            archive_years: { type: string, description: Game year span; not the player's lifespan. }
            bookmarked: { type: boolean, description: Caller-specific bookmark state; false for anonymous requests. }
            criteria: { type: string }
            portrait:
              type: object
              properties:
                image: { type: string }
                thumbnail: { type: string }
            bio: { $ref: '#/components/schemas/Biography' }
            urls:
              allOf:
                - $ref: '#/components/schemas/ResourceLinks'
                - required: [api_detail, api_bio, api_notable_games, api_games, api_pgn, html_games, html_about]
    PublicPlayers:
      type: object
      required: [source, query, active_bucket, archive_buckets, count, results]
      properties:
        source: { const: public }
        query: { type: string }
        active_bucket: { type: string }
        archive_buckets: { type: array, items: { type: object } }
        count: { type: integer, minimum: 0 }
        results: { type: array, items: { $ref: '#/components/schemas/PublicPlayer' } }
    PublicPlayerDetail:
      type: object
      required: [source, player]
      properties:
        source: { const: public }
        player: { $ref: '#/components/schemas/PublicPlayer' }
    PublicPlayerBiography:
      type: object
      required: [source, player, bio]
      properties:
        source: { const: public }
        player: { $ref: '#/components/schemas/PlayerIdentity' }
        bio: { $ref: '#/components/schemas/Biography' }
    PublicGame:
      type: object
      required: [token, player, white, black, result, event, date, urls]
      properties:
        token: { type: string, description: Canonical slug on new detail and notable routes; legacy player/slug tokens remain valid. }
        player:
          anyOf:
            - $ref: '#/components/schemas/PlayerIdentity'
            - { type: 'null' }
        white: { type: string }
        black: { type: string }
        display_white: { type: string }
        display_black: { type: string }
        result: { type: string }
        event: { type: string }
        site: { type: string }
        date: { type: string, description: PGN date; unknown month or day may contain question marks. }
        played_on: { type: [string, 'null'], format: date }
        round: { type: string }
        eco: { type: string }
        opening: { type: string }
        event_round: { type: string, description: Curated round label when sort=event. }
        move_count: { type: [integer, 'null'] }
        white_elo: { type: [integer, 'null'] }
        black_elo: { type: [integer, 'null'] }
        urls: { $ref: '#/components/schemas/ResourceLinks' }
        pgn: { type: string }
        mainline: { type: object }
        memberships: { type: array, items: { type: object } }
    PublicGamePage:
      type: object
      required: [source, count, page, page_size, page_count, next, previous, results]
      properties:
        source: { const: public }
        query: { type: string }
        archive_player: { type: string }
        archive_event: { type: string }
        since: { type: [integer, 'null'] }
        until: { type: [integer, 'null'] }
        sort: { type: string, enum: [asc, desc, event] }
        count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        page_count: { type: integer, minimum: 1 }
        next: { type: [string, 'null'], description: Relative URL; null at the end. }
        previous: { type: [string, 'null'] }
        results: { type: array, items: { $ref: '#/components/schemas/PublicGame' } }
    PublicNotableGames:
      type: object
      required: [source, player, count, results]
      properties:
        source: { const: public }
        player: { $ref: '#/components/schemas/PlayerIdentity' }
        count: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [position, title, annotation, game]
            properties:
              position: { type: integer, minimum: 1 }
              title: { type: string }
              annotation: { type: string }
              game: { $ref: '#/components/schemas/PublicGame' }
    PublicEventIndex:
      type: object
      required: [query]
      properties:
        query: { type: string }
        series_slug: { type: string }
        series_cards:
          type: array
          items:
            type: object
            required: [name, slug, eyebrow, description, year_span, year_from, year_to, event_count, game_count]
            properties:
              name: { type: string }
              slug: { type: string }
              eyebrow: { type: string }
              description: { type: string }
              year_span: { type: string }
              year_from: { type: [integer, 'null'] }
              year_to: { type: [integer, 'null'] }
              event_count: { type: integer }
              game_count: { type: integer }
        events:
          type: array
          items:
            type: object
            required: [name, slug, event_type, event_type_label, year, game_count, expected_game_count, series]
            properties:
              name: { type: string }
              slug: { type: string }
              event_type: { type: string }
              event_type_label: { type: string }
              year: { type: [integer, 'null'] }
              game_count: { type: integer }
              expected_game_count: { type: integer }
              series: { type: object }
    PublicEvents:
      type: object
      required: [source, query, count, results]
      properties:
        source: { const: public }
        query: { type: string }
        count: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [name, slug, year, game_count, expected_game_count, event_type, series, source, urls]
            properties:
              name: { type: string }
              slug: { type: string }
              year: { type: integer }
              game_count: { type: integer }
              expected_game_count: { type: integer }
              event_type: { type: object }
              series: { type: [object, 'null'] }
              source: { type: object }
              urls: { $ref: '#/components/schemas/ResourceLinks' }
    AnnotatedBooks:
      type: object
      required: [source, count, results]
      properties:
        source: { const: annotated }
        count: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [slug, label, source_url, game_count, cover_image, urls, download]
            properties:
              slug: { type: string }
