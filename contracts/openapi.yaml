    post:
      summary: Update native mobile board, engine, sound, speech or cast settings
      operationId: updateMobileSettings
      security:
      - MobileSessionToken: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Send only the settings to change. Sound and speech apply to the Android app only.
              properties:
                board_theme:
                  description: A key from GET board.themes.
                  type: string
                piece_set:
                  description: A key from GET board.piece_sets.
                  type: string
                engine_depth:
                  description: An unsupported depth resets to the default.
                  type: integer
                engine_lines:
                  description: 1 to 5; any other value resets to the default.
                  type: integer
                engine_eval_bar:
                  type: boolean
                engine_enabled:
                  type: boolean
                sound_set:
                  description: A key from GET sound.sets; choosing one turns speech off.
                  type: string
                sound_volume:
                  description: 0 to 100; values outside the range are clamped.
                  type: integer
                speech_enabled:
                  description: Requires speech.available.
                  type: boolean
                speech_level:
                  description: 1 to 10, clamped to that range and rounded to the nearest 0.5. Requires speech.available.
                  type: number
                speech_voice:
                  description: Requires speech.available.
                  type: string
                cast_coach_email:
                  description: An empty string removes it.
                  maxLength: 254
                  type: string
                cast_cc_emails:
                  type:
                  - array
                  - string
                  items:
                    type: string
                  description: A list of addresses, or one string separated by commas, semicolons or spaces.
                cast_bcc_emails:
                  type:
                  - array
                  - string
                  items:
                    type: string
                  description: A list of addresses, or one string separated by commas, semicolons or spaces.
              type: object
