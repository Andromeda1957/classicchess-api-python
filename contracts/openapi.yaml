# Generated by `python manage.py generate_openapi` from the operations declared in
# api/routers/. Do not edit; change the code and regenerate.
openapi: 3.1.0
info:
  title: Classic Chess API
  version: 1.7.0
  description: Discover curated players, approved biographies, notable games, events, chess history and annotated books; search the broader MasterDB; and download PGN. Public reads need no API key. Player, event, book and notable-game catalogs are complete lists. Game searches are paginated. Relative response URLs resolve against the server origin. Account automation uses scoped bearer tokens. Christian J. Walls' personal over-the-board games (/christian_walls/games/) are deliberately not part of this API; they remain on the website only.
servers:
- url: https://classicchess.com
paths:
  /api/v1/:
    get:
      summary: Discover collections, resource links, formats and pagination
      operationId: discoverApi
      tags:
      - Discovery
      responses:
        '200':
          description: Public API catalog; no authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscovery'
  /api/v1/public/chess-today/:
    get:
      summary: Today's sourced chess-history anniversaries
      description: Uses the site timezone. All reviewed entries are returned in featured order. No API key is required.
      operationId: getChessToday
      responses:
        '200':
          description: The site date and its history entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChessTodayDay'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/chess-today/{month}/{day}/:
    get:
      summary: Chess-history anniversaries on a specific month and day
      description: February 29 is available every year. Each entry includes its historical year. No draft or editorial review data is returned.
      operationId: getChessTodayOnDate
      parameters:
      - name: month
        in: path
        required: true
        schema:
          maximum: 12
          minimum: 1
          type: integer
      - name: day
        in: path
        required: true
        schema:
          maximum: 31
          minimum: 1
          type: integer
      responses:
        '200':
          description: Reviewed history entries for the requested anniversary date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChessTodayDay'
        '404':
          description: Invalid calendar date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/:
    get:
      summary: List every curated player, including approved biographies and resource links
      description: A complete unpaginated catalog of players with archived games. JSON is the default and preserves the existing profile fields. Use format=txt for names only, one per line. A missing or withheld biography is null. Follow urls.api_detail, urls.api_bio, urls.api_notable_games, urls.api_games and urls.api_pgn to explore a player.
      operationId: listCuratedPlayers
      tags:
      - Curated players
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 80
          type: string
      - name: format
        in: query
        description: JSON metadata by default; txt returns only the complete list of names or titles.
        schema:
          default: json
          enum:
          - json
          - txt
          type: string
      - name: bucket
        in: query
        description: Archive era key returned in archive_buckets. An unknown key selects all eras.
        schema:
          maxLength: 40
          type: string
      responses:
        '200':
          description: Complete public player catalog or UTF-8 names, one per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayers'
            text/plain:
              schema:
                type: string
                example: |
                  Mikhail Tal
                  José Raúl Capablanca
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/cards/:
    get:
      summary: List every curated player as a compact card for player lists
      description: 'The same players, order, filters and links as listCuratedPlayers, with only the approved biography''s headline (epithet, lifespan, crown) instead of its full text: about a twelfth of the bytes. Follow urls.api_bio or urls.api_detail for the biography when a player is opened.'
      operationId: listCuratedPlayerCards
      tags:
      - Curated players
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 80
          type: string
      - name: bucket
        in: query
        description: Archive era key returned in archive_buckets. An unknown key selects all eras.
        schema:
          maxLength: 40
          type: string
      responses:
        '200':
          description: Complete public player catalog as compact cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerCards'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/:
    get:
      summary: Get one curated player profile, approved biography, portrait and links
      operationId: getCuratedPlayer
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: One public profile. bio is null when unavailable; bookmarked belongs to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerDetail'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/bio/:
    get:
      summary: Read an approved player biography, structured sections, quotes and sources
      description: 'The same content as the player''s HTML about page: the biography, its "From the archive" game picks (archive_picks) and the Books section (bibliography). The bibliography is published independently of biography approval.'
      operationId: getCuratedPlayerBiography
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: Player identity plus bio. Both absent and withheld biographies return bio null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerBiography'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/notable-games/:
    get:
      summary: List a player's curated notable games, in editorial order
      description: Complete unpaginated list. Each entry has its one-based position, editorial title, annotation and a game summary with canonical detail and PGN URLs. The annotation explains the selection; it is not move-by-move commentary. An empty selection returns count 0 and results []. Only public games belonging to this player appear. A game with one clear event adds urls.api_event_about and urls.html_event_about, as the website list links its event.
      operationId: listCuratedNotableGames
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: Ordered notable-game selection with canonical game tokens and URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNotableGames'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/event-series/:
    get:
      summary: Browse event-series cards, select a series, or search events
      description: 'Complete catalog. Supply either q or series; omit both for series cards, including Matches and Misc. A series answer lists its events oldest first and adds the series page layout: event_order and its named sections. 503 when the series'' sections or membership disagree with the archive.'
      operationId: listEventSeries
      tags:
      - Curated events
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: series
        in: query
        schema:
          maxLength: 160
          pattern: ^[a-z0-9-]+$
          type: string
      responses:
        '200':
          description: Series cards or their member events, in archive order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventIndex'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The series does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/:
    get:
      summary: List every public study-event archive
      operationId: listCuratedEvents
      tags:
      - Curated events
      parameters:
      - name: q
        in: query
        description: Filter by event name, slug, series, site, source label, or year.
        schema:
          maxLength: 120
          type: string
      - name: format
        in: query
        description: JSON metadata by default; txt returns only the complete list of names or titles.
        schema:
          default: json
          enum:
          - json
          - txt
          type: string
      responses:
        '200':
          description: Complete public event inventory with canonical metadata, counts, and links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvents'
            text/plain:
              schema:
                type: string
                description: Complete list of names, one per line.
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/{event_slug}/:
    get:
      summary: Get one public study-event archive with canonical metadata and links
      operationId: getCuratedEvent
      tags:
      - Curated events
      parameters:
      - name: event_slug
        in: path
        required: true
        description: Exact slug from the curated-event catalog.
        schema:
          example: wcc-1972-fischer-spassky
          type: string
      responses:
        '200':
          description: One event with counts, series, source labels and API/HTML links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventDetail'
        '404':
          description: No public study event with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/{event_slug}/about/:
    get:
      summary: Read an event's about page, write-up, photographs, vitals and cross table
      description: The same facts as the event's HTML about page. bio is null when no write-up exists; auto_vitals are always computed from the archive. A game collection takes its dates and location from its write-up only. crosstable is null when the event has no computable table, and otherwise has kind match, tournament, team or incomplete. archive_gap carries the page's "Incomplete record" notice and collection_note the note a game collection prints. Image URLs are absolute.
      operationId: getCuratedEventAbout
      tags:
      - Curated events
      parameters:
      - name: event_slug
        in: path
        required: true
        description: Exact slug from the curated-event catalog.
        schema:
          example: wcc-1972-fischer-spassky
          type: string
      responses:
        '200':
          description: Event identity plus about-page content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventAbout'
        '404':
          description: No public study event with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/gallery/:
    get:
      summary: Browse or search the historical photograph gallery with attribution
      description: Paginated in catalog order. q matches players, events, places, scenes, dates and sources, like the gallery page. Every photograph carries its source, license and credit; reuse must honor attribution.required and usage_terms. Image URLs are absolute.
      operationId: listGalleryPhotos
      tags:
      - Gallery
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: page
        in: query
        schema:
          default: 1
          minimum: 1
          type: integer
      - name: page_size
        in: query
        description: Values above 100 are clamped to 100.
        schema:
          default: 48
          minimum: 1
          type: integer
      responses:
        '200':
          description: One page of photographs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: page is past the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/gallery/{photo_id}/:
    get:
      summary: Get one gallery photograph with its source, license and credit
      operationId: getGalleryPhoto
      tags:
      - Gallery
      parameters:
      - name: photo_id
        in: path
        required: true
        schema:
          maxLength: 160
          type: string
      responses:
        '200':
          description: One photograph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPhotoDetail'
        '404':
          description: No photograph with this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/beginner-games/:
    get:
      summary: Read the ordered beginner games guide
      description: Complete ordered curriculum. Each entry has a one-based step, its study focus, and a spoiler-free game summary. starters lists the players the guide suggests studying first, with the reason it gives.
      operationId: getBeginnerGames
      tags:
      - Curated games
      responses:
        '200':
          description: Guide stages in teaching order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBeginnerGames'
        '503':
          description: The checked-in curriculum cannot currently be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/daily/:
    get:
      summary: Get today's Game of the Day
      description: 'The same frozen daily pick the /daily/ page redirects to, as spoiler-free identity: the descriptor names the players, result and event without moves. game is null when no daily game can be published. Fetch urls.api_detail for PGN and mainline.'
      operationId: getDailyGame
      tags:
      - Curated games
      responses:
        '200':
          description: The server date and today's game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDailyGame'
  /api/v1/public/event-of-the-day/:
    get:
      summary: Get today's Event of the day
      description: 'The landmark tournament or title match on today''s homepage card: its name, one-line tagline and the winner the card pictures, with links to the event write-up. It rotates daily and skips an event whose winner another of the day''s homepage picks already pictures, so it always matches the homepage. event is null when no event can be published.'
      operationId: getEventOfTheDay
      tags:
      - Curated events
      responses:
        '200':
          description: The site date and today's event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventOfTheDay'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/todays-picks/:
    get:
      summary: Get today's homepage picks
      description: 'Every face of today''s homepage card, in its order: Player of the day, Game of the Day, On this day and Event of the day, each with the portrait the card shows. They come from one daily chain in which a later pick skips a player an earlier one already pictures, so they always match the homepage. Each face is null when the homepage omits it.'
      operationId: getTodaysPicks
      tags:
      - Curated games
      responses:
        '200':
          description: The site date and today's homepage picks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTodaysPicks'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/search/:
    get:
      summary: Search the curated archive or the site content like the site search box
      description: 'Without kind, returns the grouped preview the site search overlay shows: counts plus the first players, events and games. With kind games, events or players, returns one 50-row page of that result kind. Queries may name one player, two players (a matchup), an event, or general game terms, optionally with a year. With kind site, returns one 20-row page of the /search/?kind=site results: the site''s own pages and their sections, player biographies, event histories and What''s New posts, best match first, each with a quoted snippet and the matched words as character ranges. The preview covers the curated archive only, as the website''s Archive search does; site content appears only with kind site.'
      operationId: searchSite
      tags:
      - Search
      parameters:
      - name: q
        in: query
        required: true
        description: At most 8 searchable terms.
        schema:
          maxLength: 120
          minLength: 1
          type: string
      - name: kind
        in: query
        description: games, events or players return one 50-row page of that curated archive kind. site returns one 20-row page of the site's own pages, player biographies, event histories and What's New posts.
        schema:
          enum:
          - games
          - events
          - players
          - site
          type: string
      - name: page
        in: query
        description: Requires kind. Pages past the end return the last page.
        schema:
          default: 1
          minimum: 1
          type: integer
      responses:
        '200':
          description: Grouped archive preview, one page of a curated result kind, or one page of site content when kind is site.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SiteSearchPreview'
                - $ref: '#/components/schemas/SiteSearchPage'
                - $ref: '#/components/schemas/SiteContentSearchPage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/site-updates/:
    get:
      summary: List What's New posts, newest first
      description: 'The posts the What''s New page lists, with every field their pages show: the plain-text body paragraphs, the onward link, and the image with its alt text and, for a gallery photograph, its source, license and credit. A post dated after today stays hidden until that day, as on the site. Image URLs are absolute. The Atom feed at /updates/feed/ carries the newest 20.'
      operationId: listSiteUpdates
      tags:
      - Site updates
      parameters:
      - name: page
        in: query
        schema:
          default: 1
          minimum: 1
          type: integer
      - name: page_size
        in: query
        description: Values above 100 are clamped to 100.
        schema:
          default: 20
          minimum: 1
          type: integer
      responses:
        '200':
          description: One page of What's New posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdatePage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: page is past the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/site-updates/{update_id}/:
    get:
      summary: Get one What's New post
      description: 'The posts the What''s New page lists, with every field their pages show: the plain-text body paragraphs, the onward link, and the image with its alt text and, for a gallery photograph, its source, license and credit. A post dated after today stays hidden until that day, as on the site. Image URLs are absolute.'
      operationId: getSiteUpdate
      tags:
      - Site updates
      parameters:
      - name: update_id
        in: path
        required: true
        description: 'Post ID as returned in id: its YYYY-MM-DD date and a slug.'
        schema:
          type: string
      responses:
        '200':
          description: One published post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateDetail'
        '404':
          description: No published post with this ID. A post dated after today is not found until that day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/themes/:
    get:
      summary: Study theme taxonomy, board rules, measured precision and game inventory
      description: Automatic tags describe sustained board features. Curated tags and study_focus identify reviewed instructional examples; tags alone do not imply instructional quality.
      operationId: listStudyThemes
      tags:
      - Public archive
      responses:
        '200':
          description: Complete theme taxonomy with inventory links.
          content:
            application/json:
              schema:
                properties:
                  source:
                    const: public
                  count:
                    minimum: 0
                    type: integer
                  results:
                    items:
                      properties:
                        slug:
                          type: string
                        label:
                          type: string
                        category:
                          enum:
                          - pawn-structure
                          - endgame
                          - middlegame
                          type: string
                        rule:
                          type: string
                        precision:
                          properties:
                            predicted_positive:
                              minimum: 0
                              type: integer
                            true_positive:
                              minimum: 0
                              type: integer
                            precision:
                              type:
                              - number
                              - 'null'
                            method:
                              type: string
                          required:
                          - predicted_positive
                          - true_positive
                          - precision
                          - method
                          type: object
                        game_count:
                          minimum: 0
                          type: integer
                        urls:
                          $ref: '#/components/schemas/ResourceLinks'
                      required:
                      - slug
                      - label
                      - category
                      - rule
                      - precision
                      - game_count
                      - urls
                      type: object
                    type: array
                required:
                - source
                - count
                - results
                type: object
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/games/:
    get:
      summary: Search player- and event-backed public archive games
      description: A row whose game has one clear event adds urls.api_event_about and urls.html_event_about, as the website game lists link its event.
      operationId: listPublicGames
      tags:
      - Public archive
      parameters:
      - name: theme
        in: query
        description: Comma-separated taxonomy slugs from /public/themes/. All requested tags must match.
        schema:
          maxLength: 512
          type: string
      - name: eco
        in: query
        description: ECO code or prefix, for example D or D30.
        schema:
          maxLength: 3
          type: string
      - name: result
        in: query
        schema:
          enum:
          - 1-0
          - 0-1
          - 1/2-1/2
          - '*'
          type: string
      - name: annotation_q
        in: query
