  /api/v1/annotated/books/{book_slug}/ccnb/:
    get:
      summary: Download an annotated book as a .ccnb Notebook package
      description: 'The website''s book download (urls.ccnb): every annotated game with its notes, the book''s mapped source pages and its rights metadata, for Classic Chess Notebook clients. CCNB-Format: 3 selects the binary record container; the ccnb_format=2 or 3 query is equivalent and header and query must agree; no choice defaults to legacy format 2. Unsupported, repeated or conflicting values return ccnb_format_unsupported. Responses carry CCNB-Format, Vary: CCNB-Format and an ETag naming the format and package digest; the package is public for an hour, then revalidated.'
      operationId: downloadAnnotatedBook
      tags:
      - Annotated books
      parameters:
      - name: book_slug
        in: path
        required: true
        schema:
          maxLength: 128
          type: string
      - name: ccnb_format
        in: query
        description: Exact 2 or 3, equivalent to CCNB-Format; absent both defaults to 2. Repeated values or header disagreement are rejected.
        schema:
          type: string
      responses:
        '200':
          description: Unencrypted Classic Chess Notebook package attachment.
          content:
            application/vnd.classicchess.notebook:
              schema:
                type: string
                format: binary
        '400':
          description: Unsupported or conflicting CCNB-Format or ccnb_format (error code ccnb_format_unsupported).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: No downloadable annotated book with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/:
    get:
      summary: Get one annotated game
      operationId: getAnnotatedGame
      parameters:
      - name: book_slug
        in: path
        required: true
        schema:
          type: string
      - name: game_slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: One annotated game with PGN, annotation notes and its scanned source pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotatedGame'
        '404':
          description: Unknown book (JSON error envelope), or unknown game in a known book (HTML page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
                description: Django's HTML error page, not the JSON error envelope.
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/pgn/:
    get:
      summary: Get one annotated game as PGN
      operationId: getAnnotatedGamePgn
      parameters:
      - name: book_slug
        in: path
        required: true
        schema:
          type: string
      - name: game_slug
        in: path
        required: true
        schema:
          type: string
      - name: open
        in: query
        description: notebook serves the PGN inline instead of as an attachment.
        schema:
          const: notebook
      responses:
        '200':
          description: Raw annotated PGN with source headers and comments.
          content:
            application/x-chess-pgn:
              schema:
                type: string
        '404':
          description: Unknown book (JSON error envelope), or unknown game in a known book (HTML page).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
            text/html:
              schema:
                type: string
                description: Django's HTML error page, not the JSON error envelope.
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/annotated/books/{book_slug}/games/{game_slug}/gif/:
    get:
      summary: Export one annotated book game as an animated GIF
      description: 'Requires a registered account: a personal API token of any scope, a device session, or a signed-in browser. Exports share the site''s per-account GIF limit.'
      operationId: getAnnotatedGameGif
      tags:
      - Annotated books
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: book_slug
        in: path
        required: true
        schema:
          type: string
      - name: game_slug
        in: path
        required: true
        schema:
          type: string
      - name: orientation
        in: query
        schema:
          default: white
          enum:
          - white
          - black
          type: string
      - name: format
        in: query
        description: mp4 returns the same animation as an H.264 video.
        schema:
          default: gif
          enum:
          - gif
          - mp4
          type: string
      responses:
        '200':
          description: Animated GIF attachment, or the same animation as an H.264 MP4 video with format=mp4.
          content:
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: The game cannot be rendered, or orientation or format is invalid (error code invalid_gif).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: No registered account; JSON error authentication_required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Game not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: GIF export limit reached; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Export admission is temporarily unavailable; honor Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/account/gym/:
    get:
      summary: The Gym's bots, time controls and the account's first page of games
      description: 'Every active account may play. Bot moves are computed on the server; the bot''s weights never leave it. can_review_all is true only for the Gym''s review accounts, which may also list and read other players'' games (never change them). Each bot lists its weight versions as its card does: the version menu, each version''s move-match and training figures, and the default a new game plays.'
      operationId: getGym
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: page_size
        in: query
