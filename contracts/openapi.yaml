      operationId: exportMasterGames
      parameters:
      - name: player
        in: query
        description: Resolved MasterDB player identity.
        schema:
          maxLength: 80
          type: string
      - name: side
        in: query
        schema:
          default: either
          enum:
          - either
          - white
          - black
