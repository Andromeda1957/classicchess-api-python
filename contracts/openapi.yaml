  /api/v1/public/gym/games/{token}/:
    get:
      summary: A Gym game by its signed share link
      description: 'Every Gym game is public to anyone who holds its link, from its start, and no setting makes it private. This answers with what the link shows a visitor: the game on the analysis board, its PGN, and the bot with the version it plays. The player''s clocks, take-backs and abort are left out. A game still being played reads with its clock settled, so a game lost on time reads as over; ask again to follow it. The account''s games carry the address in urls.api_share.'
      operationId: getSharedGymGame
      security: []
      parameters:
      - name: token
        in: path
        required: true
        description: 'The game''s signed token: the last path segment of the game''s urls.share.'
        schema:
          example: 42.UdIv0NXnPaQ8SDu2cYEOqT1ZYAuPTm7-ZvJRgtfm3fs
          pattern: ^[0-9]+\.[A-Za-z0-9_-]+$
          type: string
      responses:
        '200':
          description: The game as its link shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GymSharedGame'
        '404':
          description: 'not_found: the token is not a valid link, or the game was deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-access: 'The game''s signed link is the credential: anyone who holds the token from urls.share may read the game, as anyone may open that link on the website. A malformed, forged or altered token, or a deleted game, returns 404. Read-only; no bearer token or account cookie is required.'
  /api/v1/account/puzzles/batch/:
    get:
      summary: Download a bounded offline puzzle batch
      description: Up to 100 distinct puzzles from the rotation, or current misses with result=missed. Store account_id and generation with the batch. Each puzzle has its exact revision. Offline packs use the puzzle source facts without a remote source-game lookup. Downloads are limited to 30 per account per hour.
      operationId: getPuzzleBatch
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
