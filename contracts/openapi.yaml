                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - notifications:write
  /api/v1/account/notifications/{notification_id}/read/:
    post:
      summary: Mark one notification read
      operationId: markNotificationRead
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Marked read (safe to retry), with the new unread count.
