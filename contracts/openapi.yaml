        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                name:
                  maxLength: 120
                  minLength: 1
                  type: string
                description:
                  default: ''
                  maxLength: 2000
                  type: string
                idempotency_key:
                  description: Unique per account. Retry with the same creation input.
                  maxLength: 80
                  minLength: 1
                  type: string
                items:
                  description: Games in exact playback order; each game appears once.
                  items:
                    additionalProperties: false
                    properties:
                      game:
                        maxLength: 200
                        minLength: 1
                        type: string
                      note:
                        default: ''
                        description: 'Plain text: why this game or what to look for.'
                        maxLength: 2000
                        type: string
                    required:
                    - game
                    type: object
                  maxItems: 100
                  minItems: 1
                  type: array
              required:
              - name
              - idempotency_key
              - items
              type: object
      responses:
        '200':
          description: Previously created plan for the same idempotency key.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    collection:
