          type: boolean
        id:
          type: integer
      required:
      - ok
      - id
      type: object
    GymAborted:
      properties:
        ok:
          type: boolean
        id:
          type: integer
        aborted:
          type: boolean
      required:
      - ok
      - id
      - aborted
      type: object
    GymSharedGame:
      description: |-
        A game as its signed link shows it to anyone who holds the link.

        The link's page is the analysis board with the game loaded, turned to the
        member's side. The player's own controls (clocks, take-backs, abort) and
        the account's API routes are not part of it.
      properties:
        id:
          type: integer
        bot:
          type: string
        bot_version:
          description: Key of the bot version the game plays, as in the bot's versions.
          type: string
        bot_name:
          description: The bot with the version the game plays, for example Romantic Era Bot v4.
          type: string
        player:
          description: Username of the member who played the bot, as the PGN names them.
          type: string
        human_color:
          description: The member's side; the board opens from it.
          enum:
          - white
          - black
          type: string
        moves:
          description: UCI moves from the starting position.
          items:
            type: string
          type: array
        sans:
          items:
            type: string
          type: array
        fen:
          description: The position after the last move.
          type: string
        ply:
          type: integer
        result:
          description: 1-0, 0-1, 1/2-1/2 or * while in play.
          type: string
        finished:
          type: boolean
        termination:
          type: string
        termination_label:
          type: string
        opening:
          type: string
        time_control:
          description: minutes+increment, or empty for an unlimited game.
          type: string
        date:
          description: The day the game started, in UTC, as the PGN Date gives it.
          format: date
          type: string
        pgn:
          description: The game's PGN, as the link's analysis board loads it and urls.pgn downloads it.
          type: string
        urls:
          $ref: '#/components/schemas/ResourceLinks'
      required:
      - id
      - bot
      - bot_version
      - bot_name
      - player
      - human_color
      - moves
      - sans
      - fen
      - ply
      - result
      - finished
      - termination
      - termination_label
      - opening
      - time_control
      - date
      - pgn
      - urls
      type: object
    PuzzleSummary:
      properties:
        account_id:
          description: Stable authenticated account identity for isolating downloaded puzzles.
          type: string
        generation:
          description: Reset version. An offline attempt must keep the version from when it began.
          minimum: 0
          type: integer
        solved:
          description: Puzzles solved on the first try since the last reset; they left the rotation.
          type: integer
        missed:
          description: Puzzles missed since the last reset; they stay in the rotation.
          type: integer
        rotation:
          description: 'Puzzles the account still meets: every puzzle but its first-try solves.'
          type: integer
        total:
          description: Published puzzles.
          type: integer
      required:
      - solved
      - missed
      - rotation
      - total
      type: object
    PuzzleMove:
      properties:
        after:
          description: The moves already played from the puzzle position, in UCI, solver and opponent alternating; empty for the first solver move.
          items:
            type: string
          type: array
        move:
          description: An accepted solver move in UCI.
          type: string
        reply:
          type:
          - string
          - 'null'
          description: The opponent's UCI reply, or null when this move solves the puzzle.
        from_game:
          description: True when the game itself continued with this move.
          type: boolean
      required:
      - after
      - move
      - reply
      - from_game
      type: object
    PuzzleSolution:
      properties:
        main:
          description: The main line in UCI, solver and opponent moves alternating.
          items:
            type: string
          type: array
        main_san:
          description: The main line in SAN.
          items:
            type: string
          type: array
        moves:
          description: Every accepted solver move, depth first. The accepted moves at a point are the entries whose after equals the moves played so far; any other solver move is wrong.
          items:
            $ref: '#/components/schemas/PuzzleMove'
          type: array
      required:
      - main
      - main_san
      - moves
      type: object
    Puzzle:
      properties:
        id:
          example: p-000ccc1f
          type: string
        revision:
          description: Identity of these exact puzzle data, required when syncing a downloaded attempt.
          pattern: ^[0-9a-f]{64}$
          type: string
        heading:
          type: string
        prompt:
          description: What the solver must find, for example "Find the best move for White."
          type: string
        solver:
          enum:
          - white
          - black
          type: string
        white:
          type: string
        black:
          type: string
        event:
          type: string
        year:
          type:
          - integer
          - 'null'
        goal:
          enum:
          - mate
          - advantage
          - equality
          type: string
        goal_label:
          type: string
        mate_in:
          type:
          - integer
          - 'null'
        start_fen:
          description: 'Where lead starts: the game start, or fen itself when lead is empty.'
          type: string
        lead:
          description: The game in UCI from start_fen to the puzzle position, so a client can replay it. Empty for a puzzle the game cannot reach, such as a book diagram.
          items:
            type: string
          type: array
        fen:
          description: The puzzle position, with the solver to move.
          type: string
        solution:
          $ref: '#/components/schemas/PuzzleSolution'
        info_rows:
          description: The source game's facts, else the puzzle's own.
          items:
            properties:
              label:
                description: A PGN tag name such as Event, Date, White or WhiteElo.
                type: string
              value:
                type: string
              url:
                description: 'The website page the row''s value links to, as the trainer''s Game info shows it: a study player''s about page on White or Black, or the event''s about page on Event. Empty when the row links nowhere.'
                type: string
            required:
            - label
            - value
            type: object
          type: array
        game:
          type:
          - object
          - 'null'
          properties:
            api:
              description: 'The game in the public JSON API: an archive game or a MasterDB game.'
              type: string
            html:
              description: The game page at the puzzle position.
              type: string
            ply:
              description: Half-moves from the start of the game to the puzzle position.
              type: integer
          required:
          - api
          - html
          - ply
          description: The source game, or null when it is not available.
        urls:
          properties:
            api:
              type: string
            result:
              description: POST how this play went.
              type: string
            next:
              description: GET another puzzle from the rotation.
              type: string
            html:
              description: The puzzle on the website.
              type: string
          required:
          - api
          - result
          - next
          - html
          type: object
      required:
      - id
      - heading
      - prompt
      - solver
      - white
      - black
      - event
      - year
      - goal
      - goal_label
      - mate_in
      - start_fen
      - lead
      - fen
      - solution
      - info_rows
      - game
      - urls
      type: object
    PuzzleBatch:
      properties:
        account_id:
          type: string
        generation:
          minimum: 0
          type: integer
        puzzles:
          items:
            $ref: '#/components/schemas/Puzzle'
          maxItems: 100
          type: array
      required:
      - account_id
      - generation
      - puzzles
      type: object
    PuzzleResultSaved:
      properties:
        status:
          enum:
          - saved
          - duplicate
          type: string
        event_id:
          format: uuid
          type: string
        generation:
          minimum: 0
          type: integer
        id:
          type: string
        result:
          description: The saved result. A first-try solve stands until Reset puzzles, so replaying a solved puzzle never puts it back in the rotation.
          enum:
          - solved
          - missed
          type: string
        summary:
          $ref: '#/components/schemas/PuzzleSummary'
      required:
      - id
      - result
      - summary
      type: object
    PuzzleHistoryEntry:
      properties:
        id:
          type: string
        result:
          enum:
          - solved
          - missed
          type: string
        result_label:
          enum:
          - Solved
          - Incorrect
          type: string
        played_at:
          description: When the result was saved, ISO 8601 in UTC.
          type: string
        white:
          type: string
        black:
          type: string
        event:
          type: string
        year:
          type:
          - integer
          - 'null'
        fen:
          type: string
        solver:
          enum:
          - white
          - black
          type: string
        last_move:
          type:
          - string
          - 'null'
          description: The UCI move that led to the puzzle position.
        urls:
          properties:
            api:
              type: string
          required:
          - api
          type: object
      required:
      - id
      - result
      - result_label
      - played_at
      - white
      - black
      - event
      - year
      - fen
      - solver
      - last_move
      - urls
      type: object
    PuzzleHistoryPage:
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        page_count:
          type: integer
        results:
          items:
            $ref: '#/components/schemas/PuzzleHistoryEntry'
          type: array
      required:
      - count
      - page
      - page_size
      - page_count
      - results
      type: object
    PuzzleReset:
      properties:
        reset:
          description: Results returned to the rotation; the history keeps them.
          type: integer
        summary:
          $ref: '#/components/schemas/PuzzleSummary'
      required:
      - reset
      - summary
      type: object
  securitySchemes:
    AccountApiToken:
      type: http
      scheme: bearer
      bearerFormat: Classic Chess personal API token
    MobileSessionToken:
      type: http
      scheme: bearer
      bearerFormat: Classic Chess native mobile session token
