                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the notifications:write scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not in this account's inbox.
          content:
