          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The personal API token lacks notebooks:manage (missing_scope), or the account is not the owner or a manager (permission_denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Notebook not found in the account library, or no such chapter in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - notebooks:manage
  /api/v1/account/notebooks/{notebook_uuid}/file/:
    get:
      summary: Download the whole Notebook as a .ccnb file
      description: 'Members may always export. Other accounts may export only when the owner allowed public exports. Send CCNB-Format: 3 for the binary record container. Browser URLs may instead send ccnb_format=2 or 3; no format choice defaults to legacy format 2. Invalid or conflicting choices return ccnb_format_unsupported. Responses identify CCNB-Format and Vary on it, with representation-specific ETags. Capabilities that cannot be represented losslessly in format 2 are refused.'
      operationId: downloadAccountNotebook
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: notebook_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ccnb_format
        in: query
        description: Exact 2 or 3, equivalent to CCNB-Format; absent both defaults to 2. Repeated values or header disagreement are rejected.
        schema:
          type: string
      responses:
        '200':
          description: Unencrypted Classic Chess Notebook file.
          content:
            application/vnd.classicchess.notebook:
              schema:
                type: string
                format: binary
        '400':
          description: Unsupported CCNB-Format or content cannot be represented losslessly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the notebooks:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Notebook not found, not visible, or not exportable by this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - notebooks:read
    post:
      summary: Download the Notebook as a password-protected .ccnb file
      description: 'Members only. The password encrypts this one file and is not stored. CCNB-Format: 3 negotiates authenticated binary blocks. The form URL may instead send ccnb_format=2 or 3; no choice defaults to legacy AES-GCM. Invalid or conflicting values return ccnb_format_unsupported. The response includes CCNB-Format, Vary: CCNB-Format and a representation-specific ETag.'
      operationId: downloadEncryptedAccountNotebook
      security:
      - AccountApiToken: *id001
      - MobileSessionToken: *id002
      parameters:
      - name: notebook_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ccnb_format
        in: query
        description: Exact 2 or 3, equivalent to CCNB-Format; absent both defaults to 2. Repeated values or header disagreement are rejected.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                password:
                  description: At least 12 characters and at most 1024 UTF-8 bytes.
                  minLength: 12
                  type: string
              required:
              - password
              type: object
      responses:
        '200':
          description: Encrypted Classic Chess Notebook file.
          content:
            application/vnd.classicchess.notebook:
              schema:
                type: string
                format: binary
        '400':
          description: Missing or unacceptable password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing, invalid, expired or revoked bearer token. Browser cookie sessions are not accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Personal API token is missing the notebooks:read scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Notebook not found, or the account is not a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Operation rejected; retain the error message and do not retry writes blindly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-required-scopes:
      - notebooks:read
  /api/v1/account/notebooks/{notebook_uuid}/chapters/{chapter_id}/pgn/:
    get:
      summary: Download one Notebook chapter as PGN
