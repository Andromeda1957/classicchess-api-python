# Generated by `python manage.py generate_openapi` from the operations declared in
# api/routers/. Do not edit; change the code and regenerate.
openapi: 3.1.0
info:
  title: Classic Chess API
  version: 1.7.0
  description: Discover curated players, approved biographies, notable games, events, chess history and annotated books; search the broader MasterDB; and download PGN. Public reads need no API key. Player, event, book and notable-game catalogs are complete lists. Game searches are paginated. Relative response URLs resolve against the server origin. Account automation uses scoped bearer tokens. Christian J. Walls' personal over-the-board games (/christian_walls/games/) are deliberately not part of this API; they remain on the website only.
servers:
- url: https://classicchess.com
paths:
  /api/v1/:
    get:
      summary: Discover collections, resource links, formats and pagination
      operationId: discoverApi
      tags:
      - Discovery
      responses:
        '200':
          description: Public API catalog; no authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiDiscovery'
  /api/v1/public/chess-today/:
    get:
      summary: Today's sourced chess-history anniversaries
      description: Uses the site timezone. All reviewed entries are returned in featured order. No API key is required.
      operationId: getChessToday
      responses:
        '200':
          description: The site date and its history entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChessTodayDay'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/chess-today/{month}/{day}/:
    get:
      summary: Chess-history anniversaries on a specific month and day
      description: February 29 is available every year. Each entry includes its historical year. No draft or editorial review data is returned.
      operationId: getChessTodayOnDate
      parameters:
      - name: month
        in: path
        required: true
        schema:
          maximum: 12
          minimum: 1
          type: integer
      - name: day
        in: path
        required: true
        schema:
          maximum: 31
          minimum: 1
          type: integer
      responses:
        '200':
          description: Reviewed history entries for the requested anniversary date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChessTodayDay'
        '404':
          description: Invalid calendar date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: The reviewed catalog is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/:
    get:
      summary: List every curated player, including approved biographies and resource links
      description: A complete unpaginated catalog of players with archived games. JSON is the default and preserves the existing profile fields. Use format=txt for names only, one per line. A missing or withheld biography is null. Follow urls.api_detail, urls.api_bio, urls.api_notable_games, urls.api_games and urls.api_pgn to explore a player.
      operationId: listCuratedPlayers
      tags:
      - Curated players
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 80
          type: string
      - name: format
        in: query
        description: JSON metadata by default; txt returns only the complete list of names or titles.
        schema:
          default: json
          enum:
          - json
          - txt
          type: string
      - name: bucket
        in: query
        description: Archive era key returned in archive_buckets. An unknown key selects all eras.
        schema:
          maxLength: 40
          type: string
      responses:
        '200':
          description: Complete public player catalog or UTF-8 names, one per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayers'
            text/plain:
              schema:
                type: string
                example: |
                  Mikhail Tal
                  José Raúl Capablanca
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/:
    get:
      summary: Get one curated player profile, approved biography, portrait and links
      operationId: getCuratedPlayer
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: One public profile. bio is null when unavailable; bookmarked belongs to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerDetail'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/bio/:
    get:
      summary: Read an approved player biography, structured sections, quotes and sources
      operationId: getCuratedPlayerBiography
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: Player identity plus bio. Both absent and withheld biographies return bio null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPlayerBiography'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/players/{player_slug}/notable-games/:
    get:
      summary: List a player's curated notable games, in editorial order
      description: Complete unpaginated list. Each entry has its one-based position, editorial title, annotation and a game summary with canonical detail and PGN URLs. The annotation explains the selection; it is not move-by-move commentary. An empty selection returns count 0 and results []. Only public games belonging to this player appear.
      operationId: listCuratedNotableGames
      tags:
      - Curated players
      parameters:
      - name: player_slug
        in: path
        required: true
        description: Exact slug from the curated-player catalog, not a display name or MasterDB identity.
        schema:
          example: mikhail-tal
          type: string
      responses:
        '200':
          description: Ordered notable-game selection with canonical game tokens and URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNotableGames'
        '404':
          description: No public player archive with this slug and at least one archived game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/event-series/:
    get:
      summary: Browse event-series cards, select a series, or search events
      description: Complete catalog. Supply either q or series; omit both for series cards, including Matches and Misc.
      operationId: listEventSeries
      tags:
      - Curated events
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: series
        in: query
        schema:
          maxLength: 160
          pattern: ^[a-z0-9-]+$
          type: string
      responses:
        '200':
          description: Series cards or their member events, in archive order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventIndex'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The series does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/:
    get:
      summary: List every public study-event archive
      operationId: listCuratedEvents
      tags:
      - Curated events
      parameters:
      - name: q
        in: query
        description: Filter by event name, slug, series, site, source label, or year.
        schema:
          maxLength: 120
          type: string
      - name: format
        in: query
        description: JSON metadata by default; txt returns only the complete list of names or titles.
        schema:
          default: json
          enum:
          - json
          - txt
          type: string
      responses:
        '200':
          description: Complete public event inventory with canonical metadata, counts, and links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvents'
            text/plain:
              schema:
                type: string
                description: Complete list of names, one per line.
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/{event_slug}/:
    get:
      summary: Get one public study-event archive with canonical metadata and links
      operationId: getCuratedEvent
      tags:
      - Curated events
      parameters:
      - name: event_slug
        in: path
        required: true
        description: Exact slug from the curated-event catalog.
        schema:
          example: wcc-1972-fischer-spassky
          type: string
      responses:
        '200':
          description: One event with counts, series, source labels and API/HTML links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventDetail'
        '404':
          description: No public study event with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/events/{event_slug}/about/:
    get:
      summary: Read an event's about page, write-up, photographs, vitals and cross table
      description: The same facts as the event's HTML about page. bio is null when no write-up exists; auto_vitals are always computed from the archive. crosstable is null when the event has no computable table, and otherwise has kind match, tournament, team or incomplete. Image URLs are absolute.
      operationId: getCuratedEventAbout
      tags:
      - Curated events
      parameters:
      - name: event_slug
        in: path
        required: true
        description: Exact slug from the curated-event catalog.
        schema:
          example: wcc-1972-fischer-spassky
          type: string
      responses:
        '200':
          description: Event identity plus about-page content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEventAbout'
        '404':
          description: No public study event with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/gallery/:
    get:
      summary: Browse or search the historical photograph gallery with attribution
      description: Paginated in catalog order. q matches players, events, places, scenes, dates and sources, like the gallery page. Every photograph carries its source, license and credit; reuse must honor attribution.required and usage_terms. Image URLs are absolute.
      operationId: listGalleryPhotos
      tags:
      - Gallery
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: page
        in: query
        schema:
          default: 1
          minimum: 1
          type: integer
      - name: page_size
        in: query
        description: Values above 100 are clamped to 100.
        schema:
          default: 48
          minimum: 1
          type: integer
      responses:
        '200':
          description: One page of photographs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: page is past the last page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/gallery/{photo_id}/:
    get:
      summary: Get one gallery photograph with its source, license and credit
      operationId: getGalleryPhoto
      tags:
      - Gallery
      parameters:
      - name: photo_id
        in: path
        required: true
        schema:
          maxLength: 160
          type: string
      responses:
        '200':
          description: One photograph.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPhotoDetail'
        '404':
          description: No photograph with this ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/beginner-games/:
    get:
      summary: Read the ordered beginner games guide
      description: Complete ordered curriculum. Each entry has a one-based step, its study focus, and a spoiler-free game summary.
      operationId: getBeginnerGames
      tags:
      - Curated games
      responses:
        '200':
          description: Guide stages in teaching order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBeginnerGames'
        '503':
          description: The checked-in curriculum cannot currently be published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/daily/:
    get:
      summary: Get today's Game of the Day
      description: 'The same frozen daily pick the /daily/ page redirects to, as spoiler-free identity: the descriptor names the players, result and event without moves. game is null when no daily game can be published. Fetch urls.api_detail for PGN and mainline.'
      operationId: getDailyGame
      tags:
      - Curated games
      responses:
        '200':
          description: The server date and today's game.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDailyGame'
  /api/v1/public/search/:
    get:
      summary: Search the curated archive like the site search box
      description: 'Without kind, returns the grouped preview the site search overlay shows: counts plus the first players, events and games. With kind, returns one 50-row page of that result kind. Queries may name one player, two players (a matchup), an event, or general game terms, optionally with a year.'
      operationId: searchSite
      tags:
      - Search
      parameters:
      - name: q
        in: query
        required: true
        description: At most 8 searchable terms.
        schema:
          maxLength: 120
          minLength: 1
          type: string
      - name: kind
        in: query
        schema:
          enum:
          - games
          - events
          - players
          type: string
      - name: page
        in: query
        description: Requires kind. Pages past the end return the last page.
        schema:
          default: 1
          minimum: 1
          type: integer
      responses:
        '200':
          description: Grouped preview, or one page of a result kind when kind is supplied.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SiteSearchPreview'
                - $ref: '#/components/schemas/SiteSearchPage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/games/:
    get:
      summary: Search player- and event-backed public archive games
      operationId: listPublicGames
      tags:
      - Public archive
      parameters:
      - name: q
        in: query
        schema:
          maxLength: 120
          type: string
      - name: archive_player
        in: query
        schema:
          maxLength: 80
          type: string
      - name: archive_event
        in: query
        description: Event slug returned by the public events endpoint.
        schema:
          maxLength: 255
          type: string
      - name: search_mode
        in: query
        description: Which fields q searches. players matches players, event, site, and date; openings matches opening name and ECO; all matches both.
        schema:
          default: all
          enum:
          - all
          - players
          - openings
          type: string
      - name: since
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: sort
        in: query
        description: event preserves curated round order and requires archive_event.
        schema:
          default: asc
          enum:
          - asc
          - desc
          - event
          type: string
      - name: page
        in: query
        schema:
          default: 1
          type: integer
      - name: page_size
        in: query
        schema:
          default: 50
          maximum: 100
          type: integer
      responses:
        '200':
          description: Paginated public archive game summaries, including event-only games. Returned navigable URLs use the shared canonical game record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGamePage'
        '400':
          description: Query exceeds its bounds or requests an unsupported format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/games/export/:
    get:
      summary: Export player- and event-backed public archive games
      operationId: exportPublicGames
      parameters:
      - name: q
        in: query
        description: At most 8 searchable terms.
        schema:
          maxLength: 120
          type: string
      - name: archive_player
        in: query
        schema:
          maxLength: 80
          type: string
      - name: archive_event
        in: query
        schema:
          maxLength: 255
          type: string
      - name: search_mode
        in: query
        description: Which fields q searches. players matches players, event, site, and date; openings matches opening name and ECO; all matches both.
        schema:
          default: all
          enum:
          - all
          - players
          - openings
          type: string
      - name: since
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: sort
        in: query
        description: Search order; event preserves curated round order and requires archive_event.
        schema:
          default: asc
          enum:
          - asc
          - desc
          - event
          type: string
      - name: format
        in: query
        description: pgn or ndjson (jsonl is an alias). Without it, an Accept header naming application/x-ndjson or application/jsonl selects ndjson.
        schema:
          enum:
          - pgn
          - ndjson
          - jsonl
          type: string
      - name: pgnInJson
        in: query
        description: Include each game's PGN in ndjson records.
        schema:
          default: true
          type: boolean
      - name: pgn_in_json
        in: query
        description: Alias of pgnInJson.
        schema:
          deprecated: true
          type: boolean
      - name: tokens
        in: query
        description: Comma-separated canonical game_slug or legacy player_slug/game_slug tokens, max 300. Token lists are limited to 64 KiB. Tokens take precedence over the search.
        schema:
          type: string
      - name: ids
        in: query
        description: Alias of tokens.
        schema:
          deprecated: true
          type: string
      responses:
        '200':
          description: A PGN bundle attachment, or with format=ndjson one PublicGame JSON object per line; at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: PGN games separated by blank lines.
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/PublicGame'
        '400':
          description: More than 300 tokens, or the query exceeds its bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: A requested public archive game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client exceeded the export request budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: Export public archive games by canonical or compatibility token body
      operationId: exportPublicGamesByToken
      parameters:
      - name: q
        in: query
        description: At most 8 searchable terms.
        schema:
          maxLength: 120
          type: string
      - name: archive_player
        in: query
        schema:
          maxLength: 80
          type: string
      - name: archive_event
        in: query
        schema:
          maxLength: 255
          type: string
      - name: search_mode
        in: query
        description: Which fields q searches. players matches players, event, site, and date; openings matches opening name and ECO; all matches both.
        schema:
          default: all
          enum:
          - all
          - players
          - openings
          type: string
      - name: since
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: until
        in: query
        schema:
          maximum: 9999
          minimum: 1400
          type: integer
      - name: sort
        in: query
        description: Search order; event preserves curated round order and requires archive_event.
        schema:
          default: asc
          enum:
          - asc
          - desc
          - event
          type: string
      - name: format
        in: query
        description: pgn or ndjson (jsonl is an alias). Without it, an Accept header naming application/x-ndjson or application/jsonl selects ndjson.
        schema:
          enum:
          - pgn
          - ndjson
          - jsonl
          type: string
      - name: pgnInJson
        in: query
        description: Include each game's PGN in ndjson records.
        schema:
          default: true
          type: boolean
      - name: pgn_in_json
        in: query
        description: Alias of pgnInJson.
        schema:
          deprecated: true
          type: boolean
      requestBody:
        description: Game tokens. An empty body exports the query-string search instead.
        content:
          text/plain:
            schema:
              type: string
              maxLength: 65536
              description: Comma- or newline-separated canonical game_slug or legacy player_slug/game_slug tokens, max 300.
      responses:
        '200':
          description: A PGN bundle attachment, or with format=ndjson one PublicGame JSON object per line; at most 300 games. Query exports stop at the first 300 matches; paginate game results and batch their tokens for a complete larger archive.
          content:
            application/x-chess-pgn:
              schema:
                type: string
                description: PGN games separated by blank lines.
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/PublicGame'
        '400':
          description: More than 300 tokens, the body exceeds 64 KiB, or the query exceeds its bounds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: A requested public archive game does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: The client exceeded the export request budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/public/games/{game_slug}/:
    get:
      summary: Canonical public archive game detail
      operationId: getPublicGame
      tags:
      - Public archive
      parameters:
      - name: game_slug
        in: path
        required: true
        schema:
          maxLength: 255
          type: string
      responses:
        '200':
          description: Public game detail with archive memberships, PGN, and mainline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicGame'
        '404':
          description: Game is not in a public player or event archive. Django HTML 404 page, not the JSON error envelope.
          content:
            text/html:
              schema:
                type: string
                description: Django's HTML error page, not the JSON error envelope.
  /api/v1/public/games/{game_slug}/pgn/:
    get:
      summary: Canonical public archive game PGN
      operationId: getPublicGamePgn
      parameters:
      - name: game_slug
        in: path
        required: true
        schema:
          maxLength: 255
          type: string
      responses:
        '200':
          description: Sanitized public PGN as text/plain.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Game is not in a public player or event archive. Django HTML 404 page, not the JSON error envelope.
          content:
            text/html:
              schema:
                type: string
                description: Django's HTML error page, not the JSON error envelope.
  /api/v1/public/games/{game_slug}/gif/:
    get:
      summary: Export one public archive game as an animated GIF
      description: 'Requires a registered account: a personal API token of any scope, a device session, or a signed-in browser. Exports share the site''s per-account GIF limit.'
      operationId: getPublicGameGif
      tags:
      - Public archive
      security:
      - AccountApiToken: &id001 []
      - MobileSessionToken: &id002 []
      parameters:
      - name: game_slug
        in: path
        required: true
        schema:
          maxLength: 255
          type: string
      - name: orientation
        in: query
        schema:
          default: white
          enum:
          - white
          - black
          type: string
      - name: format
        in: query
        description: mp4 returns the same animation as an H.264 video.
        schema:
          default: gif
          enum:
          - gif
          - mp4
          type: string
      responses:
        '200':
          description: Animated GIF attachment, or the same animation as an H.264 MP4 video with format=mp4.
          content:
            image/gif:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: The game cannot be rendered, or orientation or format is invalid (error code invalid_gif).
          content:
