[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "classicchess-api"
version = "0.1.0"
description = "Classic Chess archive and MasterDB API client and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Christian Walls"}]
dependencies = []

[project.urls]
Homepage = "https://classicchess.com/api/"
Repository = "https://github.com/Andromeda1957/classicchess-api-python"

[project.scripts]
classicchess-api = "andromeda_api.cli:main"

[tool.setuptools]
packages = ["andromeda_api"]
